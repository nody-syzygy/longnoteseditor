<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スライド造形ツール (16×N Grid & Perspective Preview)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: #090b10;
      color: #f1f5f9;
      user-select: none;
      -webkit-user-select: none;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    input[type="range"] {
      accent-color: #38bdf8;
    }
    .canvas-shadow {
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .tool-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border-color: #7dd3fc;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }
    .div-btn.active {
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      border-color: #7dd3fc;
      color: #ffffff;
      font-weight: 700;
    }
    .curve-btn.active {
      background: linear-gradient(135deg, #c026d3 0%, #7c3aed 100%);
      border-color: #f0abfc;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(217, 70, 239, 0.4);
    }
    .color-swatch.active {
      transform: scale(1.08);
      box-shadow: 0 0 0 2px #090b10, 0 0 0 4px #ffffff, 0 0 16px currentColor;
    }
    .layer-item.selected {
      background: rgba(14, 165, 233, 0.18);
      border-color: rgba(56, 189, 248, 0.65);
    }
    .relay-mode-btn.active-add {
      background: linear-gradient(135deg, #c026d3 0%, #9333ea 100%);
      border-color: #f0abfc;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(217, 70, 239, 0.5);
    }
    .snap-btn.active {
      background: #0284c7;
      border-color: #7dd3fc;
      color: #ffffff;
    }
    .tap-curve-btn.active {
      background: linear-gradient(135deg, #a21caf 0%, #7e22ce 100%);
      border-color: #f0abfc;
      color: #ffffff;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#090b10] text-slate-100">

  <!-- Top Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur sticky top-0 z-30 px-4 py-2">
    <div class="max-w-[1800px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-400 via-[#52FFBD] to-[#FFCD42] flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3L2 21h20L12 3z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M12 3l-5 18M12 3l5 18" />
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
            スライド造形ツール
            <span id="headerGridBadge" class="text-xs font-medium px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-500/30">16×16 パレット</span>
            <span id="autoSaveBadge" class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">自動保存: ブラウザ内</span>
          </h1>
        </div>
      </div>

      <!-- Global Actions -->
      <div class="flex items-center gap-2 flex-wrap">
        <button id="btnSelectFolder" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-600/20 hover:bg-sky-600/30 text-sky-300 border border-sky-500/40 transition flex items-center gap-1.5" title="保存先フォルダを選択して自動保存を有効化">
          <span>📁 保存フォルダ選択</span>
        </button>
        <button id="btnDownloadJson" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition" title="JSONファイルを手動保存">
          💾 JSON保存
        </button>
        <button id="btnImportJson" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition" title="保存したJSONデータを読込">
          📂 読込
        </button>
        <input type="file" id="fileImportInput" accept=".json" class="hidden" />
        <button id="btnClearAll" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-950/60 hover:bg-rose-900/80 text-rose-200 border border-rose-800/60 transition">
          🗑 全消去
        </button>
        <button id="btnExportPreview" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition flex items-center gap-1">
          ⬇ プレビュー画像保存
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-[1440px] w-full mx-auto p-1.5 sm:p-3 md:p-4 flex flex-col gap-2.5 sm:gap-4">

    <!-- 1. TOP SECTION: Enlarged Perspective Preview -->
    <section class="w-full flex flex-col bg-slate-900/80 border border-slate-800 rounded-2xl p-2 sm:p-4">
      <div class="flex flex-wrap items-center justify-between gap-1.5 sm:gap-2 mb-1.5 sm:mb-2">
        <div class="flex items-center gap-2 sm:gap-3">
          <h2 class="text-xs sm:text-base font-bold text-white flex items-center gap-1.5">
            <span>プレビュー (レーン外飛び出し対応)</span>
          </h2>
          <span id="statusToast" class="text-[10px] sm:text-xs text-sky-400 font-medium bg-slate-950/80 border border-slate-800 px-2 sm:px-3 py-0.5 sm:py-1 rounded-full truncate max-w-[200px] sm:max-w-none">パレット上で作成・編集</span>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2 text-[10px] sm:text-xs flex-wrap">
          <label class="flex items-center gap-1 text-[10px] sm:text-xs text-slate-300 bg-slate-800 px-2 sm:px-3 py-1 rounded-lg border border-slate-700 cursor-pointer hover:bg-slate-700/70 transition">
            <input type="checkbox" id="chkShowMainLines" checked class="w-3 h-3 sm:w-3.5 sm:h-3.5 rounded accent-sky-400" />
            <span>白枠・レーン線</span>
          </label>
          <label class="flex items-center gap-1 text-[10px] sm:text-xs text-slate-300 bg-slate-800 px-2 sm:px-3 py-1 rounded-lg border border-slate-700 cursor-pointer hover:bg-slate-700/70 transition">
            <input type="checkbox" id="chkShowSubGrid" class="w-3 h-3 sm:w-3.5 sm:h-3.5 rounded accent-sky-400" />
            <span>分割グリッド線</span>
          </label>
        </div>
      </div>

      <div class="w-full max-w-[1000px] mx-auto relative rounded-xl overflow-hidden canvas-shadow bg-black flex items-center justify-center">
        <canvas id="previewCanvas" width="1120" height="630" class="w-full h-auto block"></canvas>
      </div>
    </section>

    <!-- 2. MIDDLE SECTION: Always 3 Columns -->
    <section class="w-full max-w-[1160px] mx-auto grid grid-cols-[68px_minmax(0,1fr)_68px] sm:grid-cols-[108px_minmax(0,1fr)_108px] md:grid-cols-[124px_minmax(0,1fr)_124px] gap-1.5 sm:gap-3 items-start">

      <!-- LEFT VERTICAL TOOLBAR -->
      <div class="flex flex-col gap-1.5 sm:gap-2 bg-slate-900/80 border border-slate-800 rounded-xl sm:rounded-2xl p-1.5 sm:p-2">

        <!-- History: Undo / Redo -->
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg sm:rounded-xl p-1 sm:p-2 flex flex-col gap-1">
          <span class="text-[9px] sm:text-[11px] font-bold uppercase tracking-wider text-slate-300 text-center">履歴</span>
          <button id="btnUndo" class="w-full py-1.5 px-1 sm:px-2 rounded-lg text-[10px] sm:text-xs font-bold bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-100 border border-slate-600 transition disabled:opacity-35 flex items-center justify-center gap-1" title="元に戻す (Ctrl+Z)">
            <span>戻る</span>
          </button>
          <button id="btnRedo" class="w-full py-1.5 px-1 sm:px-2 rounded-lg text-[10px] sm:text-xs font-bold bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-100 border border-slate-600 transition disabled:opacity-35 flex items-center justify-center gap-1" title="やり直す (Ctrl+Y)">
            <span>進む</span>
          </button>
        </div>

        <!-- Mode Selector -->
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg sm:rounded-xl p-1 sm:p-2 flex flex-col gap-1">
          <span class="text-[9px] sm:text-[11px] font-bold uppercase tracking-wider text-slate-300 text-center">ツール</span>
          <button data-mode="draw" class="tool-btn active w-full px-1 sm:px-2 py-1.5 rounded-lg border border-slate-700 bg-slate-800/90 text-[10px] sm:text-xs font-bold flex items-center justify-center gap-1 transition">
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
            <span class="truncate">描画</span>
          </button>
          <button data-mode="eraser" class="tool-btn w-full px-1 sm:px-2 py-1.5 rounded-lg border border-slate-700 bg-slate-800/90 text-[10px] sm:text-xs font-bold flex items-center justify-center gap-1 transition" title="図形や中継点の枠をクリックして削除">
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span class="truncate">消しゴム</span>
          </button>
          <button data-mode="pan" class="tool-btn w-full px-1 sm:px-2 py-1.5 rounded-lg border border-slate-700 bg-slate-800/90 text-[10px] sm:text-xs font-bold flex items-center justify-center gap-1 transition" title="拡大したパレットをドラッグしてスクロール移動">
            <span class="truncate">移動</span>
          </button>
        </div>

        <!-- Relay Point Addition & Snap Mode -->
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg sm:rounded-xl p-1 sm:p-2 flex flex-col gap-1">
          <span class="text-[9px] sm:text-[11px] font-bold uppercase tracking-wider text-slate-300 text-center">中継点</span>
          <span id="lblSelectedNodeInfo" class="text-[9px] sm:text-[10px] font-mono text-amber-300 font-semibold truncate text-center">未選択</span>

          <button id="btnAddRelayPoint" class="relay-mode-btn w-full py-1.5 px-1 sm:px-2 rounded-lg bg-fuchsia-600/20 hover:bg-fuchsia-600/35 border border-fuchsia-500/40 text-fuchsia-200 text-[10px] sm:text-xs font-bold transition flex items-center justify-center gap-0.5" title="未選択でもONにでき、図形をクリックして選択→クリックで中継点を追加します">
            <span>＋中継追加</span>
          </button>

          <div class="pt-1 border-t border-slate-800/80 flex flex-col gap-1">
            <span class="block text-[9px] sm:text-[10px] text-slate-400 font-medium text-center truncate">配置間隔</span>
            <button id="btnSnapGrid" class="snap-btn active w-full py-1 px-1 rounded bg-slate-800 border border-slate-700 text-[9px] sm:text-[11px] font-semibold text-slate-200 transition truncate">
              グリッド
            </button>
            <button id="btnSnap1920" class="snap-btn w-full py-1 px-1 rounded bg-slate-800 border border-slate-700 text-[9px] sm:text-[11px] font-semibold text-slate-200 transition truncate">
              1920分
            </button>
          </div>
        </div>

        <!-- Copy / Paste / Delete Actions -->
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg sm:rounded-xl p-1 sm:p-2 flex flex-col gap-1">
          <span class="text-[9px] sm:text-[11px] font-bold uppercase tracking-wider text-slate-300 text-center">編集</span>
          <button id="btnCopyShape" class="w-full py-1.5 px-1 sm:px-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] sm:text-xs font-semibold text-slate-200 transition disabled:opacity-35 flex items-center justify-center gap-1" title="選択図形をコピー (Ctrl+C)">
            <span class="truncate">コピー</span>
          </button>
          <button id="btnPasteShape" class="w-full py-1.5 px-1 sm:px-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] sm:text-xs font-semibold text-slate-200 transition disabled:opacity-35 flex items-center justify-center gap-1" title="コピーした図形を貼り付け (Ctrl+V)">
            <span class="truncate">貼付</span>
          </button>
          <button id="btnDeleteShape" class="w-full py-1.5 px-1 sm:px-2 rounded-lg bg-rose-950/60 hover:bg-rose-900/80 border border-rose-800/60 text-[10px] sm:text-xs font-semibold text-rose-200 transition disabled:opacity-35 flex items-center justify-center gap-1" title="選択中の図形を削除 (Delete)">
            <span>✕</span><span class="truncate">削除</span>
          </button>
        </div>

      </div>

      <!-- CENTER COLUMN: 16×N Grid Palette Editor with Zoom Controls -->
      <div class="flex flex-col items-center justify-between bg-slate-900/80 border border-slate-800 rounded-xl sm:rounded-2xl p-1.5 sm:p-3 min-w-0 w-full">
        <div class="w-full flex flex-wrap items-center justify-between gap-1.5 mb-1.5 sm:mb-2">
          <div class="min-w-0">
            <h2 class="text-xs sm:text-base font-bold text-white flex items-center gap-1.5 flex-wrap">
              <span>パレット (<span id="lblPaletteTitleDims">16×16</span>)</span>
              <span id="lblLastWidthBadge" class="text-[10px] sm:text-xs font-mono font-semibold px-1.5 sm:px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-500/30">新規幅: 2マス</span>
            </h2>
          </div>

          <!-- Unified Palette Zoom Bar -->
          <div class="flex items-center gap-1 sm:gap-1.5 bg-slate-950/90 border border-slate-800 rounded-lg px-1.5 sm:px-2 py-1">
            <span class="text-[9px] sm:text-[11px] font-bold text-slate-400 hidden sm:inline">表示倍率</span>
            <button id="btnZoomOut" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 border border-slate-700 text-xs font-bold flex items-center justify-center transition" title="パレットを縮小">
              －
            </button>
            <input type="range" id="rngPaletteZoom" min="50" max="350" step="10" value="100" class="w-16 sm:w-24 h-1.5 bg-slate-800 rounded-lg cursor-pointer" title="表示倍率スライダー" />
            <button id="btnZoomIn" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 border border-slate-700 text-xs font-bold flex items-center justify-center transition" title="パレットを拡大">
              ＋
            </button>
            <button id="btnZoomReset" class="px-1.5 h-6 rounded bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 border border-sky-500/30 text-[10px] sm:text-xs font-mono font-bold transition" title="100%にリセット">
              100%
            </button>
          </div>
        </div>

        <!-- Scrollable & Zoomable Palette Viewport -->
        <div id="paletteViewport" class="relative w-full overflow-auto rounded-lg sm:rounded-xl bg-[#05070b] border border-slate-800/80 p-1.5 sm:p-2 block">
          <div id="paletteZoomInner" class="mx-auto relative">
            <canvas id="paletteCanvas" width="620" height="760" class="rounded-lg sm:rounded-xl canvas-shadow bg-[#07090e] cursor-crosshair touch-none block" style="max-width: none;"></canvas>
          </div>
        </div>

        <div class="w-full mt-1.5 sm:mt-2 flex items-center justify-between text-[10px] sm:text-xs bg-slate-950/90 border border-slate-800 rounded-lg sm:rounded-xl px-2 sm:px-3 py-1 sm:py-1.5">
          <span id="lblHoverTarget" class="text-slate-300 font-medium truncate">カーソル位置:</span>
          <span id="lblCursorCell" class="font-mono text-sky-300 font-bold shrink-0 ml-1">X: - , Y: -</span>
        </div>
      </div>

      <!-- RIGHT VERTICAL TOOLBAR -->
      <div class="flex flex-col gap-1.5 sm:gap-2 bg-slate-900/80 border border-slate-800 rounded-xl sm:rounded-2xl p-1.5 sm:p-2">

        <!-- Color Selector -->
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg sm:rounded-xl p-1 sm:p-2 flex flex-col items-center gap-1.5">
          <span class="text-[9px] sm:text-[11px] font-bold uppercase tracking-wider text-slate-300 text-center">色選択</span>
          <div class="flex flex-col items-center gap-1.5 sm:gap-2 py-1 w-full" id="colorPaletteContainer">
            <button data-color="green" class="color-swatch active w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl border-2 border-emerald-400/70 transition" style="color: #00e676; background: linear-gradient(0deg, #00e676 0%, rgba(0,230,118,0.14) 100%);" title="ガイド"></button>
            <button data-color="orange" class="color-swatch w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl border-2 border-amber-300/70 transition" style="color: #FFCD42; background: linear-gradient(0deg, #FFCD42 0%, rgba(255,205,66,0.14) 100%);" title="金ガイド"></button>
            <button data-color="yellowgreen" class="color-swatch w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl border-2 border-teal-300/70 transition" style="color: #52FFBD; background: #52FFBD;" title="スライド"></button>
            <button data-color="yellow" class="color-swatch w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl border-2 border-yellow-200/70 transition" style="color: #FEF7A9; background: #FEF7A9;" title="金スライド"></button>
          </div>
        </div>

        <!-- Grid Setting -->
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg sm:rounded-xl p-1 sm:p-2 flex flex-col items-center gap-1">
          <span class="text-[9px] sm:text-[11px] font-bold uppercase tracking-wider text-slate-300 text-center">グリッド</span>
          <button id="btnGridPlus" class="w-full py-1 sm:py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600 text-xs sm:text-sm font-bold text-slate-100 flex items-center justify-center transition disabled:opacity-35" title="分割数を増やす">
            ＋
          </button>
          <div class="flex flex-col items-center py-0.5">
            <span id="lblCurrentGridRows" class="text-xs sm:text-base font-extrabold font-mono text-sky-300 tracking-tight leading-none">16</span>
            <span class="text-[8px] sm:text-[9px] text-slate-400">16×N</span>
          </div>
          <button id="btnGridMinus" class="w-full py-1 sm:py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600 text-xs sm:text-sm font-bold text-slate-100 flex items-center justify-center transition disabled:opacity-35" title="分割数を減らす">
            －
          </button>
        </div>

        <!-- Curve Settings -->
        <div id="curveControlBox" class="bg-slate-950/70 border border-slate-800/90 rounded-lg sm:rounded-xl p-1 sm:p-2 flex flex-col gap-1">
          <span class="text-[9px] sm:text-[11px] font-bold uppercase tracking-wider text-slate-300 text-center">カーブ</span>
          <span id="lblCurveModeName" class="hidden sm:block text-[9px] font-mono text-fuchsia-300 font-bold text-center truncate">直線 ｜｜</span>
          <div class="flex flex-col gap-1" id="curveTypeButtons">
            <button data-curve="straight" class="curve-btn active w-full px-1 sm:px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] sm:text-xs text-slate-200 font-bold transition flex items-center justify-center">
              <span class="font-mono text-[10px] sm:text-xs">｜ ｜</span>
            </button>
            <button data-curve="left" class="curve-btn w-full px-1 sm:px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] sm:text-xs text-slate-200 font-bold transition flex items-center justify-center">
              <span class="font-mono text-[10px] sm:text-xs">（ （</span>
            </button>
            <button data-curve="right" class="curve-btn w-full px-1 sm:px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] sm:text-xs text-slate-200 font-bold transition flex items-center justify-center">
              <span class="font-mono text-[10px] sm:text-xs">） ）</span>
            </button>
          </div>
          <div class="pt-1 border-t border-slate-800/80 flex flex-col gap-1">
            <button id="btnToggleTapCurve" class="tap-curve-btn active w-full py-1 px-1 rounded bg-slate-800 border border-slate-700 text-[8px] sm:text-[10px] font-bold text-slate-200 transition truncate" title="タップ切替設定">
              タップ切替:ON
            </button>
          </div>
        </div>

      </div>

    </section>

    <!-- 3. BOTTOM SECTION -->
    <section class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-start">

      <!-- Panel A: Opacity Settings -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-3.5 flex flex-col gap-2.5">
        <div class="flex items-center justify-between">

        <button type="button" data-collapse-target="paletteSavePanelBody" data-collapse-arrow="paletteSavePanelArrow" class="flex items-center justify-between w-full text-left py-0.5 hover:opacity-80 transition">

    </section>

  </main>

  <script>
    const GRID_COLS = 16; // 16列に拡張
    const STANDARD_COLS = 12; // 標準レーン領域（12列目までを基準にプレビュー枠内に収める）
    const MAX_FINE_DIVISIONS = 1920;
    const ALLOWED_ROW_DIVISIONS = [4, 8, 16, 32, 64, 128, 192, 1920];
    const STORAGE_KEY_PALETTE = 'dot_persp_palette_autosave_v16_v1';
    const STORAGE_KEY_TEMPLATES = 'dot_persp_shape_templates_v16_v1';
    const STORAGE_KEY_SAVED_PALETTES = 'dot_persp_saved_palettes_v16_v1';

    const NODE_BOX_HALF_H = 18;
    const NODE_EDGE_HIT_W = 14;

    const COLORS = {
      green: { id: 'green', name: 'ガイド', hex: '#00e676', rgb: [0, 230, 118], type: 'guide', fadeToTransparent: true },
      yellowgreen: { id: 'yellowgreen', name: 'スライド', hex: '#52FFBD', rgb: [82, 255, 189], type: 'slide', fadeToTransparent: false },
      yellow: { id: 'yellow', name: '金スライド', hex: '#FEF7A9', rgb: [254, 247, 169], type: 'slide', fadeToTransparent: false },
      orange: { id: 'orange', name: '金ガイド', hex: '#FFCD42', rgb: [255, 205, 66], type: 'guide', fadeToTransparent: true }
    };

    const CURVE_MODES = { straight: '直線 ｜ ｜', left: 'カーブ （ （', right: 'カーブ ） ）' };

    const PERSP_GEOM = {
      topY: 0.118,
      topLeftX: 0.480,
      topRightX: 0.520,
      botY: 0.813,
      botLeftX: 0.152,
      botRightX: 0.848,
      numMainLanes: 6,
      verticalStopsFromTop: [0.0000, 0.0291, 0.0676, 0.1180, 0.1842, 0.2719, 0.3885, 0.5942, 0.8317, 1.0000]
    };

    const SMOOTH_PERSP_K = (() => {
      const stops = PERSP_GEOM.verticalStopsFromTop;
      const allDiffs = [];
      for (let i = 0; i < stops.length - 1; i++) allDiffs.push(stops[i + 1] - stops[i]);
      const interiorDiffs = allDiffs.slice(1, -1);
      let logRatioSum = 0;
      for (let i = 0; i < interiorDiffs.length - 1; i++) logRatioSum += Math.log(interiorDiffs[i + 1] / interiorDiffs[i]);
      return (logRatioSum / (interiorDiffs.length - 1)) * (stops.length - 1);
    })();

    const state = {
      mode: 'draw',
      relaySubMode: null,
      fine1920Snap: false,
      tapNodeToCycleCurve: true,
      paletteZoom: 100,
      gridRows: 16,
      lastUsedWidth: 2,
      currentColor: 'green',
      currentCurveMode: 'straight',
      slideOpacity: 0.85,
      guideOpacity: 0.85,
      showMainLines: true,
      showSubGrid: false,
      onlyMoveSelected: false,
      grid: Array.from({ length: 16 }, () => Array(GRID_COLS).fill(null)),
      shapes: [],
      selectedShapeIds: [],
      activeShapeId: null,
      activeNodeIndex: 0,
      clipboardShapes: [],
      templates: [],
      savedPalettes: [],
      directoryHandle: null,
      history: [],
      redoStack: []
    };

    const hoverState = {
      inside: false, col: 0, row: 0, px: 0, py: 0, type: null, shapeId: null, nodeIndex: -1, segIndex: -1, insertY: 0, insertLeft: 0, insertRight: 2, label: ''
    };

    const paletteCanvas = document.getElementById('paletteCanvas');
    const paletteCtx = paletteCanvas.getContext('2d');
    const previewCanvas = document.getElementById('previewCanvas');
    const previewCtx = previewCanvas.getContext('2d');
    const paletteViewport = document.getElementById('paletteViewport');
    const paletteZoomInner = document.getElementById('paletteZoomInner');

    const PALETTE_LOGICAL_W = 680; // 16列に合せてパレットの幅を少し広く調整
    const PALETTE_LOGICAL_H = 760;
    const PALETTE_PAD = { left: 48, right: 24, top: 28, bottom: 38 };
    const PLOT_W = PALETTE_LOGICAL_W - PALETTE_PAD.left - PALETTE_PAD.right;
    const PLOT_H = PALETTE_LOGICAL_H - PALETTE_PAD.top - PALETTE_PAD.bottom;
    const CELL_W = PLOT_W / GRID_COLS;

    function setPaletteZoom(newZoomPct, preserveCenter = true) {
      const clamped = Math.max(50, Math.min(350, Math.round(newZoomPct / 10) * 10));
      state.paletteZoom = clamped;
      const rng = document.getElementById('rngPaletteZoom');
      const btnReset = document.getElementById('btnZoomReset');
      if (rng) rng.value = String(clamped);
      if (btnReset) btnReset.textContent = `${clamped}%`;

      if (paletteZoomInner && paletteViewport && paletteCanvas) {
        const style = window.getComputedStyle(paletteViewport);
        const padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
        const padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
        const availW = Math.max(160, paletteViewport.clientWidth - padX);
        const baseW = Math.min(560, availW);
        const baseH = Math.round(baseW * (PALETTE_LOGICAL_H / PALETTE_LOGICAL_W));
        const targetViewportH = Math.min(Math.round(window.innerHeight * 0.74), baseH + padY + 4);
        paletteViewport.style.height = `${targetViewportH}px`;

        const prevW = paletteCanvas.offsetWidth || baseW;
        const prevH = paletteCanvas.offsetHeight || baseH;
        const viewW = paletteViewport.clientWidth;
        const viewH = paletteViewport.clientHeight;
        const centerRatioX = prevW > 0 ? (paletteViewport.scrollLeft + viewW / 2) / prevW : 0.5;
        const centerRatioY = prevH > 0 ? (paletteViewport.scrollTop + viewH / 2) / prevH : 0.5;

        const scale = clamped / 100;
        const targetW = Math.round(baseW * scale);
        const targetH = Math.round(targetW * (PALETTE_LOGICAL_H / PALETTE_LOGICAL_W));

        paletteZoomInner.style.width = `${targetW}px`;
        paletteZoomInner.style.height = `${targetH}px`;
        paletteCanvas.style.width = `${targetW}px`;
        paletteCanvas.style.height = `${targetH}px`;

        const dpr = Math.min(3.5, (window.devicePixelRatio || 1) * Math.max(1, scale * 0.85));
        const desiredPixelW = Math.round(PALETTE_LOGICAL_W * dpr);
        const desiredPixelH = Math.round(PALETTE_LOGICAL_H * dpr);
        if (paletteCanvas.width !== desiredPixelW || paletteCanvas.height !== desiredPixelH) {
          paletteCanvas.width = desiredPixelW;
          paletteCanvas.height = desiredPixelH;
        }

        renderPalette();
        if (preserveCenter && prevW > 0 && prevH > 0) {
          paletteViewport.scrollLeft = Math.max(0, Math.round(centerRatioX * targetW - viewW / 2));
          paletteViewport.scrollTop = Math.max(0, Math.round(centerRatioY * targetH - viewH / 2));
        }
      }
    }

    function stepPaletteZoom(deltaPct) { setPaletteZoom(state.paletteZoom + deltaPct, true); }
    function getCellH() { return PLOT_H / state.gridRows; }
    function getMinFineStepY(rows = state.gridRows) { return ((typeof rows === 'number' && rows > 0) ? rows : state.gridRows) / MAX_FINE_DIVISIONS; }
    function snapFine1920(val, min, max, rows = state.gridRows) {
      const validRows = (typeof rows === 'number' && rows > 0) ? rows : state.gridRows;
      const step = getMinFineStepY(validRows);
      const snapped = Math.round((Number.isFinite(val) ? val : min) / step) * step;
      return Math.max(min, Math.min(max, Number(snapped.toFixed(6))));
    }

    function formatYValue(y, rows = state.gridRows) {
      if (!Number.isFinite(y)) return '0';
      if (Math.abs(y - Math.round(y)) < 1e-4) return String(Math.round(y));
      return `${y.toFixed(2)} (${Math.round((y / rows) * MAX_FINE_DIVISIONS)}/1920)`;
    }

    function setLastUsedWidth(w) {
      state.lastUsedWidth = Math.max(1, Math.min(GRID_COLS, Math.round(w)));
      const badge = document.getElementById('lblLastWidthBadge');
      if (badge) badge.textContent = `新規幅: ${state.lastUsedWidth}マス`;
    }

    function showToast(msg) {
      const el = document.getElementById('statusToast');
      if (el) el.textContent = msg;
    }

    function normalizeShape(raw, rows = state.gridRows) {
      const validRows = (typeof rows === 'number' && rows > 0) ? rows : state.gridRows;
      const color = COLORS[raw.color] ? raw.color : 'green';
      const fineStep = getMinFineStepY(validRows);
      let nodes = [];
      if (Array.isArray(raw.nodes) && raw.nodes.length >= 2) {
        nodes = raw.nodes.map(n => ({
          left: snapInt(n.left ?? 0, 0, GRID_COLS - 1),
          right: snapInt(n.right ?? 1, 1, GRID_COLS),
          y: snapFine1920(n.y ?? 0, 0, validRows, validRows),
          curveMode: ['straight', 'left', 'right'].includes(n.curveMode) ? n.curveMode : 'straight'
        }));
      } else {
        const sL = snapInt(raw.startLeft ?? 2, 0, GRID_COLS - 1);
        const sR = Math.max(sL + 1, snapInt(raw.startRight ?? sL + 2, 1, GRID_COLS));
        const sY = snapFine1920(raw.startY ?? 0, 0, validRows - fineStep, validRows);
        const eL = snapInt(raw.endLeft ?? sL, 0, GRID_COLS - 1);
        const eR = Math.max(eL + 1, snapInt(raw.endRight ?? sR, 1, GRID_COLS));
        const eY = Math.max(sY + fineStep, snapFine1920(raw.endY ?? validRows, fineStep, validRows, validRows));
        nodes = [
          { left: sL, right: sR, y: sY, curveMode: ['straight', 'left', 'right'].includes(raw.curveMode) ? raw.curveMode : 'straight' },
          { left: eL, right: eR, y: eY, curveMode: 'straight' }
        ];
      }
      for (let i = 0; i < nodes.length; i++) {
        nodes[i].left = snapInt(nodes[i].left, 0, GRID_COLS - 1);
        nodes[i].right = Math.max(nodes[i].left + 1, snapInt(nodes[i].right, 1, GRID_COLS));
        if (i > 0 && nodes[i].y <= nodes[i - 1].y) {
          nodes[i].y = snapFine1920(nodes[i - 1].y + fineStep, 0, validRows, validRows);
        }
      }
      return { id: raw.id || ('shape_' + Date.now() + '_' + Math.floor(Math.random() * 1000)), name: raw.name || '', color, nodes };
    }

    function computeNodeSnappedY(rawRowFloat, minYLimit, maxYLimit, prevY, nextY, forceFine1920 = false) {
      const rows = state.gridRows;
      const step1920 = getMinFineStepY(rows);
      const minAllowed = prevY !== null ? prevY + step1920 : minYLimit;
      const maxAllowed = nextY !== null ? nextY - step1920 : maxYLimit;
      if (minAllowed >= maxAllowed) return Number(minAllowed.toFixed(6));
      if (forceFine1920 || state.fine1920Snap) return snapFine1920(rawRowFloat, minAllowed, maxAllowed, rows);

      const nearThreshold = Math.max(step1920 * 4, 0.85);
      if ((prevY !== null && Math.abs(rawRowFloat - prevY) <= nearThreshold) || (nextY !== null && Math.abs(rawRowFloat - nextY) <= nearThreshold)) {
        return snapFine1920(rawRowFloat, minAllowed, maxAllowed, rows);
      }
      const gridSnapped = snapInt(rawRowFloat, 0, rows);
      return Math.max(minAllowed, Math.min(maxAllowed, gridSnapped));
    }

    function createCurrentSnapshot() {
      return {
        gridRows: state.gridRows,
        grid: state.grid.map(row => row.map(cell => (cell ? { ...cell } : null))),
        shapes: JSON.parse(JSON.stringify(state.shapes)),
        selectedShapeIds: [...state.selectedShapeIds],
        activeShapeId: state.activeShapeId,
        activeNodeIndex: state.activeNodeIndex
      };
    }

    function pushSnapshotToHistory(snapshot) {
      if (!snapshot) return;
      state.history.push(snapshot);
      if (state.history.length > 50) state.history.shift();
      state.redoStack = [];
      updateHistoryButtons();
    }

    function saveHistory() { pushSnapshotToHistory(createCurrentSnapshot()); }

    function applyHistorySnapshot(snap) {
      if (!snap) return;
      dragState.active = false;
      dragState.type = null;
      dragState.pendingSnapshot = null;
      const targetRows = ALLOWED_ROW_DIVISIONS.includes(snap.gridRows) ? snap.gridRows : 16;
      state.gridRows = targetRows;
      state.grid = Array.isArray(snap.grid) ? snap.grid.map(row => row.map(cell => (cell ? { ...cell } : null))) : Array.from({ length: targetRows }, () => Array(GRID_COLS).fill(null));
      state.shapes = Array.isArray(snap.shapes) ? snap.shapes.map(s => normalizeShape(s, targetRows)) : [];
      const validIds = new Set(state.shapes.map(s => s.id));
      state.selectedShapeIds = (snap.selectedShapeIds || []).filter(id => validIds.has(id));
      state.activeShapeId = validIds.has(snap.activeShapeId) ? snap.activeShapeId : (state.selectedShapeIds[state.selectedShapeIds.length - 1] || null);
      state.activeNodeIndex = getActiveShape() ? Math.max(0, Math.min(getActiveShape().nodes.length - 1, snap.activeNodeIndex || 0)) : 0;
      updateHistoryButtons();
      updateGridDivisionUI();
      syncUIWithSelectedShape();
      renderAll();
      triggerAutoSave();
    }

    function undo() {
      if (state.history.length === 0) return;
      const current = createCurrentSnapshot();
      const prev = state.history.pop();
      state.redoStack.push(current);
      applyHistorySnapshot(prev);
      showToast('元に戻しました');
    }

    function redo() {
      if (state.redoStack.length === 0) return;
      const current = createCurrentSnapshot();
      const next = state.redoStack.pop();
      state.history.push(current);
      applyHistorySnapshot(next);
      showToast('やり直しました');
    }

    function updateHistoryButtons() {
      const bU = document.getElementById('btnUndo');
      const bR = document.getElementById('btnRedo');
      if (bU) bU.disabled = state.history.length === 0;
      if (bR) bR.disabled = state.redoStack.length === 0;
    }

    function getColorRgba(colorId, alpha = 1) {
      const c = COLORS[colorId] || COLORS.green;
      return `rgba(${c.rgb[0]}, ${c.rgb[1]}, ${c.rgb[2]}, ${Math.max(0, Math.min(1, alpha)).toFixed(3)})`;
    }

    function gridToPaletteXY(col, rowFromBot) {
      const cellH = getCellH();
      return { x: PALETTE_PAD.left + col * CELL_W, y: PALETTE_PAD.top + (state.gridRows - rowFromBot) * cellH };
    }

    function paletteXYToGrid(px, py) {
      const cellH = getCellH();
      const col = (px - PALETTE_PAD.left) / CELL_W;
      const rowFromTop = (py - PALETTE_PAD.top) / cellH;
      return { col: Math.max(0, Math.min(GRID_COLS, col)), row: Math.max(0, Math.min(state.gridRows, state.gridRows - rowFromTop)) };
    }

    function snapInt(val, min, max) { return Math.max(min, Math.min(max, Math.round(Number.isFinite(val) ? val : min))); }

    function getNodeBoxPixelRect(node) {
      const ptL = gridToPaletteXY(node.left, node.y);
      const ptR = gridToPaletteXY(node.right, node.y);
      return { x1: ptL.x, x2: ptR.x, yCenter: ptL.y, y1: ptL.y - NODE_BOX_HALF_H, y2: ptL.y + NODE_BOX_HALF_H, width: ptR.x - ptL.x, height: NODE_BOX_HALF_H * 2 };
    }

    function hitTestNodeBox(node, px, py) {
      const rect = getNodeBoxPixelRect(node);
      if (py < rect.y1 - 5 || py > rect.y2 + 5) return null;
      const edgeZone = Math.min(NODE_EDGE_HIT_W, Math.max(7, rect.width * 0.28));
      if (px >= rect.x1 - NODE_EDGE_HIT_W && px <= rect.x1 + edgeZone) return 'left';
      if (px >= rect.x2 - edgeZone && px <= rect.x2 + NODE_EDGE_HIT_W) return 'right';
      if (px > rect.x1 + edgeZone && px < rect.x2 - edgeZone) return 'center';
      return null;
    }

    function findRelayNodeAtCanvasPos(px, py) {
      const candidates = state.onlyMoveSelected ? state.shapes.filter(s => state.selectedShapeIds.includes(s.id)) : state.shapes;
      const ordered = [...candidates].sort((a, b) => (a.id === state.activeShapeId ? 1 : (b.id === state.activeShapeId ? -1 : 0)));
      for (let i = ordered.length - 1; i >= 0; i--) {
        const sh = ordered[i];
        for (let k = 1; k < sh.nodes.length - 1; k++) {
          if (hitTestNodeBox(sh.nodes[k], px, py)) return { shape: sh, nodeIndex: k };
        }
      }
      return null;
    }

    function mapLinearFromTopToPerspectiveT(vFromTop) {
      const clamped = Math.max(0, Math.min(1, vFromTop));
      return (Math.exp(SMOOTH_PERSP_K * clamped) - 1) / (Math.exp(SMOOTH_PERSP_K) - 1);
    }

    function uvToPerspectiveXY(u, vFromTop) {
      const W = previewCanvas.width;
      const H = previewCanvas.height;
      const t = mapLinearFromTopToPerspectiveT(vFromTop);
      const y = (PERSP_GEOM.topY + t * (PERSP_GEOM.botY - PERSP_GEOM.topY)) * H;
      const leftX = (PERSP_GEOM.topLeftX + t * (PERSP_GEOM.botLeftX - PERSP_GEOM.topLeftX)) * W;
      const rightX = (PERSP_GEOM.topRightX + t * (PERSP_GEOM.botRightX - PERSP_GEOM.topRightX)) * W;
      return { x: leftX + u * (rightX - leftX), y };
    }

    function gridToPerspectiveXY(col, rowFromBot) {
      // 16列のうち、標準の12マス（インデックス0〜12）をプレビュー枠内(u = 0 ~ 1)に収め、
      // レーン外の13〜16マス目は外側に飛び出すように標準12マス基準でuを計算します
      const u = col / STANDARD_COLS;
      const vFromTop = 1 - (rowFromBot / state.gridRows);
      return uvToPerspectiveXY(u, vFromTop);
    }

    function evaluateSingleEdgeAtTau(x0, x1, mode, localTau) {
      if (x0 === x1 || mode === 'straight') return x0 + (x1 - x0) * localTau;
      const easeIn = localTau * localTau;
      const easeOut = 1 - (1 - localTau) * (1 - localTau);
      if (mode === 'right') return x0 + (x1 - x0) * easeOut;
      if (mode === 'left') return x0 + (x1 - x0) * easeIn;
      return x0 + (x1 - x0) * localTau;
    }

    function evaluateSegmentEdgesAtTau(node0, node1, localTau) {
      const mode = node0.curveMode || 'straight';
      return {
        leftCol: evaluateSingleEdgeAtTau(node0.left, node1.left, mode, localTau),
        rightCol: evaluateSingleEdgeAtTau(node0.right, node1.right, mode, localTau)
      };
    }

    function evaluateSegmentPoint(node0, node1, s, localTau) {
      const row = node0.y + localTau * (node1.y - node0.y);
      const { leftCol, rightCol } = evaluateSegmentEdgesAtTau(node0, node1, localTau);
      return { col: leftCol + s * (rightCol - leftCol), row };
    }

    function getShapeAlphaAtRow(shape, row) {
      const colorObj = COLORS[shape.color] || COLORS.green;
      const totalSpan = Math.max(0.001, shape.nodes[shape.nodes.length - 1].y - shape.nodes[0].y);
      const overallTau = Math.max(0, Math.min(1, (row - shape.nodes[0].y) / totalSpan));
      return colorObj.fadeToTransparent ? state.guideOpacity * (1 - overallTau) : state.slideOpacity;
    }

    function isPointInsideShape(shape, col, row) {
      const nodes = shape.nodes;
      if (!nodes || nodes.length < 2 || row < nodes[0].y || row > nodes[nodes.length - 1].y) return false;
      for (let k = 0; k < nodes.length - 1; k++) {
        const n0 = nodes[k], n1 = nodes[k + 1];
        if (row >= n0.y && row <= n1.y) {
          const localTau = (n1.y - n0.y) <= 0 ? 0 : (row - n0.y) / (n1.y - n0.y);
          const { leftCol, rightCol } = evaluateSegmentEdgesAtTau(n0, n1, localTau);
          if (col >= Math.min(leftCol, rightCol) - 0.15 && col <= Math.max(leftCol, rightCol) + 0.15) return true;
        }
      }
      return false;
    }

    function renderPalette() {
      const ctx = paletteCtx;
      const W = PALETTE_LOGICAL_W;
      const H = PALETTE_LOGICAL_H;
      const rows = state.gridRows;
      const cellH = getCellH();

      ctx.setTransform(paletteCanvas.width / W, 0, 0, paletteCanvas.height / H, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#07090e';
      ctx.fillRect(0, 0, W, H);

      const gx0 = PALETTE_PAD.left, gy0 = PALETTE_PAD.top, gw = GRID_COLS * CELL_W, gh = PLOT_H;
      ctx.fillStyle = '#0c1017';
      ctx.fillRect(gx0, gy0, gw, gh);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
          const cell = state.grid[r] && state.grid[r][c];
          if (cell && cell.alpha > 0.005) {
            const topLeft = gridToPaletteXY(c, r + 1);
            ctx.fillStyle = getColorRgba(cell.color, cell.alpha);
            ctx.fillRect(topLeft.x, topLeft.y, CELL_W, Math.max(0.8, cellH));
          }
        }
      }

      for (const shape of state.shapes) drawSmoothShapeOnPalette(ctx, shape);

      // Vertical grid lines & 12th boundary thick line
      ctx.save();
      ctx.font = '11px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let c = 0; c <= GRID_COLS; c++) {
        const x = gx0 + c * CELL_W;
        const isBoundary12 = (c === 12); // 12のところに太線
        const isMainLane = c % 2 === 0;

        ctx.beginPath();
        ctx.moveTo(x, gy0);
        ctx.lineTo(x, gy0 + gh);
        if (isBoundary12) {
          ctx.strokeStyle = '#38bdf8'; // 水色の太線で強調
          ctx.lineWidth = 2.8;
        } else {
          ctx.strokeStyle = isMainLane ? 'rgba(255, 255, 255, 0.30)' : 'rgba(148, 163, 184, 0.15)';
          ctx.lineWidth = isMainLane ? 1.25 : 0.75;
        }
        ctx.stroke();

        if (c < GRID_COLS) {
          ctx.fillStyle = isBoundary12 ? '#38bdf8' : '#94a3b8';
          ctx.fillText(String(c + 1), x + CELL_W / 2, gy0 + gh + 18);
        }
      }

      // Horizontal grid lines
      const drawLineStep = rows >= 1920 ? 30 : (rows >= 192 ? 2 : 1);
      const quarterStep = Math.max(1, Math.round(rows / 4));
      const sixteenthStep = Math.max(1, Math.round(rows / 16));

      for (let r = 0; r <= rows; r += drawLineStep) {
        const y = gy0 + (rows - r) * cellH;
        ctx.beginPath();
        ctx.moveTo(gx0, y);
        ctx.lineTo(gx0 + gw, y);
        ctx.strokeStyle = (r % quarterStep === 0) ? 'rgba(255, 255, 255, 0.30)' : ((r % sixteenthStep === 0) ? 'rgba(203, 213, 225, 0.18)' : 'rgba(148, 163, 184, 0.09)');
        ctx.lineWidth = (r % quarterStep === 0) ? 1.2 : 0.7;
        ctx.stroke();
      }

      ctx.textAlign = 'right';
      const labelStep = rows >= 1920 ? 120 : (rows >= 192 ? 12 : (rows >= 64 ? 4 : 1));
      for (let rowNum = 1; rowNum <= rows; rowNum++) {
        if (rowNum === 1 || rowNum === rows || rowNum % labelStep === 0) {
          ctx.fillStyle = rowNum === 1 ? '#38bdf8' : '#94a3b8';
          ctx.fillText(String(rowNum), gx0 - 8, gy0 + (rows - (rowNum - 0.5)) * cellH);
        }
      }

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.68)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(gx0, gy0, gw, gh);
      ctx.restore();

      if (state.mode === 'eraser') {
        for (const sh of state.shapes) {
          if (sh.nodes && sh.nodes.length > 2) {
            for (let k = 1; k < sh.nodes.length - 1; k++) drawNodeRectangleFrame(ctx, sh.nodes[k], k, sh.nodes.length, false, true);
          }
        }
      }

      if (state.mode === 'draw') {
        for (const sh of getSelectedShapes()) drawShapeHandlesOnPalette(ctx, sh, sh.id === state.activeShapeId);
      }

      if (hoverState.inside && !dragState.active) drawHoverPreviewOnPalette(ctx);
    }

    function drawNodeRectangleFrame(ctx, node, nodeIndex, totalNodes, isActiveNode, isEraserHint = false) {
      const rect = getNodeBoxPixelRect(node);
      const isStart = nodeIndex === 0, isEnd = nodeIndex === totalNodes - 1;
      const baseColor = isEraserHint ? '#fb7185' : (isStart ? '#38bdf8' : (isEnd ? '#fbbf24' : '#e879f9'));

      ctx.save();
      if (isActiveNode) {
        ctx.fillStyle = isStart ? 'rgba(14, 165, 233, 0.20)' : (isEnd ? 'rgba(245, 158, 11, 0.20)' : 'rgba(217, 70, 239, 0.22)');
        ctx.fillRect(rect.x1, rect.y1, rect.width, rect.height);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.0;
        ctx.strokeRect(rect.x1, rect.y1, rect.width, rect.height);

        ctx.beginPath();
        ctx.moveTo(rect.x1, rect.yCenter);
        ctx.lineTo(rect.x2, rect.yCenter);
        ctx.strokeStyle = baseColor;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 3]);
        ctx.stroke();
        ctx.setLineDash([]);

        const gripW = 6;
        ctx.fillStyle = baseColor;
        ctx.fillRect(rect.x1 - gripW / 2, rect.y1 - 1, gripW, rect.height + 2);
        ctx.fillRect(rect.x2 - gripW / 2, rect.y1 - 1, gripW, rect.height + 2);
        ctx.strokeRect(rect.x1 - gripW / 2, rect.y1 - 1, gripW, rect.height + 2);
        ctx.strokeRect(rect.x2 - gripW / 2, rect.y1 - 1, gripW, rect.height + 2);

        const cTag = !isEnd ? (node.curveMode === 'left' ? ' [（（]' : (node.curveMode === 'right' ? ' [））]' : ' [｜｜]')) : '';
        drawHoverBadge(ctx, (rect.x1 + rect.x2) * 0.5, isStart ? rect.y2 + 11 : rect.y1 - 11, `${isStart ? '始点' : (isEnd ? '終点' : `中継${nodeIndex}`)}${cTag} (縦辺:幅 / 内側:移動)`, '#0f172a', baseColor);
      } else {
        ctx.fillStyle = isEraserHint ? 'rgba(244, 63, 94, 0.14)' : 'rgba(15, 23, 42, 0.45)';
        ctx.fillRect(rect.x1, rect.y1 + 4, rect.width, rect.height - 8);
        ctx.strokeStyle = baseColor;
        ctx.lineWidth = 1.8;
        ctx.strokeRect(rect.x1, rect.y1 + 4, rect.width, rect.height - 8);

        ctx.font = 'bold 10px "Noto Sans JP", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(isEraserHint ? `中継${nodeIndex}` : (isStart ? '始点' : (isEnd ? '終点' : `中継${nodeIndex}`)), (rect.x1 + rect.x2) * 0.5, rect.yCenter);
      }
      ctx.restore();
    }

    function drawHoverBadge(ctx, x, y, text, bgColor = '#0284c7', borderColor = 'rgba(255,255,255,0.75)') {
      if (!text) return;
      ctx.save();
      ctx.font = 'bold 10px "Noto Sans JP", sans-serif';
      const textW = ctx.measureText(text).width + 14;
      const clampedX = Math.max(PALETTE_PAD.left + textW / 2, Math.min(PALETTE_LOGICAL_W - PALETTE_PAD.right - textW / 2, x));
      ctx.fillStyle = bgColor;
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(clampedX - textW / 2, y - 9.5, textW, 19, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, clampedX, y);
      ctx.restore();
    }

    function drawHoverPreviewOnPalette(ctx) {
      ctx.save();
      if (hoverState.type === 'shape' || hoverState.type === 'eraseShape' || hoverState.type === 'relaySelectShape') {
        const sh = state.shapes.find(s => s.id === hoverState.shapeId);
        if (sh && sh.nodes.length >= 2) {
          drawSmoothShapeOnPalette(ctx, sh);
          drawHoverBadge(ctx, hoverState.px, hoverState.py - 20, hoverState.label, hoverState.type === 'eraseShape' ? '#be123c' : '#0369a1');
        }
      } else if (hoverState.type === 'eraseRelay') {
        const sh = state.shapes.find(s => s.id === hoverState.shapeId);
        const node = sh && sh.nodes[hoverState.nodeIndex];
        if (node) {
          const rect = getNodeBoxPixelRect(node);
          ctx.fillStyle = 'rgba(225, 29, 72, 0.38)';
          ctx.fillRect(rect.x1, rect.y1, rect.width, rect.height);
          drawHoverBadge(ctx, (rect.x1 + rect.x2) * 0.5, rect.y1 - 14, hoverState.label, '#be123c');
        }
      } else if (hoverState.type === 'relayAdd') {
        const rect = getNodeBoxPixelRect({ left: hoverState.insertLeft, right: hoverState.insertRight, y: hoverState.insertY });
        ctx.fillStyle = 'rgba(217, 70, 239, 0.25)';
        ctx.fillRect(rect.x1, rect.y1, rect.width, rect.height);
        drawHoverBadge(ctx, (rect.x1 + rect.x2) * 0.5, rect.y1 - 14, hoverState.label, '#a21caf');
      }
      ctx.restore();
    }

    function drawSmoothShapeOnPalette(ctx, shape) {
      const nodes = shape.nodes;
      if (!nodes || nodes.length < 2) return;
      ctx.save();
      ctx.beginPath();
      ctx.rect(PALETTE_PAD.left, PALETTE_PAD.top, GRID_COLS * CELL_W, PLOT_H);
      ctx.clip();

      for (let k = 0; k < nodes.length - 1; k++) {
        const n0 = nodes[k], n1 = nodes[k + 1];
        const steps = Math.max(24, Math.round(60 / (nodes.length - 1)));
        for (let i = 0; i < steps; i++) {
          const tau0 = i / steps, tau1 = (i + 1) / steps;
          const alpha = getShapeAlphaAtRow(shape, n0.y + ((tau0 + tau1) * 0.5) * (n1.y - n0.y));
          if (alpha <= 0.003) continue;

          ctx.beginPath();
          for (let j = 0; j <= 20; j++) {
            const pt = gridToPaletteXY(evaluateSegmentPoint(n0, n1, j / 20, tau0).col, evaluateSegmentPoint(n0, n1, j / 20, tau0).row);
            if (j === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
          }
          for (let j = 20; j >= 0; j--) {
            const pt = gridToPaletteXY(evaluateSegmentPoint(n0, n1, j / 20, tau1).col, evaluateSegmentPoint(n0, n1, j / 20, tau1).row);
            ctx.lineTo(pt.x, pt.y);
          }
          ctx.closePath();
          ctx.fillStyle = getColorRgba(shape.color, alpha);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function drawShapeHandlesOnPalette(ctx, shape, isPrimary) {
      const nodes = shape.nodes;
      if (!nodes || nodes.length < 2) return;
      ctx.save();
      for (let k = 0; k < nodes.length; k++) {
        if (k !== state.activeNodeIndex) drawNodeRectangleFrame(ctx, nodes[k], k, nodes.length, false, false);
      }
      drawNodeRectangleFrame(ctx, nodes[state.activeNodeIndex], state.activeNodeIndex, nodes.length, true, false);
      ctx.restore();
    }

    function renderPreview() {
      const ctx = previewCtx;
      const W = previewCanvas.width;
      const H = previewCanvas.height;
      const rows = state.gridRows;

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
          const cell = state.grid[r] && state.grid[r][c];
          if (cell && cell.alpha > 0.005) {
            const p00 = gridToPerspectiveXY(c, r), p10 = gridToPerspectiveXY(c + 1, r), p11 = gridToPerspectiveXY(c + 1, r + 1), p01 = gridToPerspectiveXY(c, r + 1);
            ctx.beginPath();
            ctx.moveTo(p00.x, p00.y); ctx.lineTo(p10.x, p10.y); ctx.lineTo(p11.x, p11.y); ctx.lineTo(p01.x, p01.y);
            ctx.closePath();
            ctx.fillStyle = getColorRgba(cell.color, cell.alpha);
            ctx.fill();
          }
        }
      }

      for (const shape of state.shapes) drawSmoothShapeOnPerspective(ctx, shape);

      if (state.showMainLines) {
        ctx.save();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.8;
        for (const t of [0, 1]) {
          const y = (PERSP_GEOM.topY + t * (PERSP_GEOM.botY - PERSP_GEOM.topY)) * H;
          ctx.beginPath();
          ctx.moveTo((PERSP_GEOM.topLeftX + t * (PERSP_GEOM.botLeftX - PERSP_GEOM.topLeftX)) * W, y);
          ctx.lineTo((PERSP_GEOM.topRightX + t * (PERSP_GEOM.botRightX - PERSP_GEOM.topRightX)) * W, y);
          ctx.stroke();
        }
        for (let i = 0; i <= PERSP_GEOM.numMainLanes; i++) {
          const u = i / PERSP_GEOM.numMainLanes;
          const pTop = uvToPerspectiveXY(u, 0), pBot = uvToPerspectiveXY(u, 1);
          ctx.lineWidth = (i === 0 || i === PERSP_GEOM.numMainLanes) ? 2.8 : 2.2;
          ctx.beginPath(); ctx.moveTo(pTop.x, pTop.y); ctx.lineTo(pBot.x, pBot.y); ctx.stroke();
        }
        ctx.restore();
      }
    }

    function drawSmoothShapeOnPerspective(ctx, shape) {
      const nodes = shape.nodes;
      if (!nodes || nodes.length < 2) return;
      ctx.save();
      for (let k = 0; k < nodes.length - 1; k++) {
        const n0 = nodes[k], n1 = nodes[k + 1];
        const steps = Math.max(48, Math.round(110 / (nodes.length - 1)));
        for (let i = 0; i < steps; i++) {
          const tau0 = i / steps, tau1 = (i + 1) / steps;
          const alpha = getShapeAlphaAtRow(shape, n0.y + ((tau0 + tau1) * 0.5) * (n1.y - n0.y));
          if (alpha <= 0.003) continue;

          ctx.beginPath();
          for (let j = 0; j <= 28; j++) {
            const pt = gridToPerspectiveXY(evaluateSegmentPoint(n0, n1, j / 28, tau0).col, evaluateSegmentPoint(n0, n1, j / 28, tau0).row);
            if (j === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
          }
          for (let j = 28; j >= 0; j--) {
            const pt = gridToPerspectiveXY(evaluateSegmentPoint(n0, n1, j / 28, tau1).col, evaluateSegmentPoint(n0, n1, j / 28, tau1).row);
            ctx.lineTo(pt.x, pt.y);
          }
          ctx.closePath();
          ctx.fillStyle = getColorRgba(shape.color, alpha);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function renderAll() { renderPalette(); renderPreview(); renderLayerList(); }
    function getActiveShape() { return state.shapes.find(s => s.id === state.activeShapeId) || null; }
    function getSelectedShapes() { const set = new Set(state.selectedShapeIds); return state.shapes.filter(s => set.has(s.id)); }

    function selectSingleShape(shapeId, nodeIdx = 0) {
      if (!shapeId) {
        state.selectedShapeIds = [];
        state.activeShapeId = null;
        state.activeNodeIndex = 0;
      } else {
        state.selectedShapeIds = [shapeId];
        state.activeShapeId = shapeId;
        const sh = getActiveShape();
        state.activeNodeIndex = sh ? Math.max(0, Math.min(sh.nodes.length - 1, nodeIdx)) : 0;
        if (sh && sh.nodes[state.activeNodeIndex]) setLastUsedWidth(sh.nodes[state.activeNodeIndex].right - sh.nodes[state.activeNodeIndex].left);
      }
      syncUIWithSelectedShape();
    }

    function toggleShapeSelection(shapeId) {
      const idx = state.selectedShapeIds.indexOf(shapeId);
      if (idx >= 0) {
        state.selectedShapeIds.splice(idx, 1);
        if (state.activeShapeId === shapeId) state.activeShapeId = state.selectedShapeIds[state.selectedShapeIds.length - 1] || null;
      } else {
        state.selectedShapeIds.push(shapeId);
        state.activeShapeId = shapeId;
      }
      syncUIWithSelectedShape();
      renderAll();
    }

    function setGridRowsDivision(newRows) {
      if (!ALLOWED_ROW_DIVISIONS.includes(newRows) || newRows === state.gridRows) return;
      saveHistory();
      const scale = newRows / state.gridRows;
      const fineStep = getMinFineStepY(newRows);
      const newGrid = Array.from({ length: newRows }, () => Array(GRID_COLS).fill(null));
      for (let r = 0; r < newRows; r++) {
        const srcR = Math.min(state.gridRows - 1, Math.floor(r / scale));
        for (let c = 0; c < GRID_COLS; c++) {
          if (state.grid[srcR] && state.grid[srcR][c]) newGrid[r][c] = { ...state.grid[srcR][c] };
        }
      }
      for (const sh of state.shapes) {
        for (let i = 0; i < sh.nodes.length; i++) {
          sh.nodes[i].y = snapFine1920(sh.nodes[i].y * scale, i === 0 ? 0 : sh.nodes[i - 1].y + fineStep, newRows - (sh.nodes.length - 1 - i) * fineStep, newRows);
        }
      }
      state.gridRows = newRows;
      state.grid = newGrid;
      updateGridDivisionUI();
      renderAll();
      triggerAutoSave();
    }

    function stepGridDivision(delta) {
      const idx = ALLOWED_ROW_DIVISIONS.indexOf(state.gridRows);
      const next = Math.max(0, Math.min(ALLOWED_ROW_DIVISIONS.length - 1, idx + delta));
      if (next !== idx) setGridRowsDivision(ALLOWED_ROW_DIVISIONS[next]);
    }

    function updateGridDivisionUI() {
      document.getElementById('headerGridBadge').textContent = `16×${state.gridRows} パレット`;
      document.getElementById('lblPaletteTitleDims').textContent = `16×${state.gridRows}`;
      document.getElementById('lblCurrentGridRows').textContent = `${state.gridRows}`;
    }

    function syncUIWithSelectedShape() {
      const activeShape = getActiveShape();
      const selected = getSelectedShapes();
      const hasSel = selected.length > 0;

      document.getElementById('btnCopyShape').disabled = !hasSel;
      document.getElementById('btnPasteShape').disabled = state.clipboardShapes.length === 0;
      document.getElementById('btnDeleteShape').disabled = !hasSel;
      document.getElementById('btnSaveTemplate').disabled = !activeShape;
      document.getElementById('btnLayerUp').disabled = !hasSel;
      document.getElementById('btnLayerDown').disabled = !hasSel;

      let cMode = state.currentCurveMode;
      let nodeInfo = '未選択';
      if (activeShape) {
        state.activeNodeIndex = Math.max(0, Math.min(activeShape.nodes.length - 1, state.activeNodeIndex));
        cMode = activeShape.nodes[Math.min(state.activeNodeIndex, activeShape.nodes.length - 2)].curveMode || 'straight';
        nodeInfo = `Y:${formatYValue(activeShape.nodes[state.activeNodeIndex].y)} (幅:${activeShape.nodes[state.activeNodeIndex].right - activeShape.nodes[state.activeNodeIndex].left})`;
      }
      document.getElementById('lblSelectedNodeInfo').textContent = selected.length > 1 ? `${selected.length}個選択中` : nodeInfo;

      const btnAdd = document.getElementById('btnAddRelayPoint');
      if (btnAdd) {
        btnAdd.classList.toggle('active-add', state.relaySubMode === 'add');
        btnAdd.innerHTML = state.relaySubMode === 'add' ? '<span>● 追加中(ON)</span>' : '<span>＋中継追加</span>';
      }

      document.querySelectorAll('.curve-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.curve === cMode));
      document.getElementById('lblCurveModeName').textContent = CURVE_MODES[cMode] || CURVE_MODES.straight;
    }

    function toggleRelayAddMode() {
      state.relaySubMode = state.relaySubMode === 'add' ? null : 'add';
      if (state.relaySubMode === 'add' && state.mode === 'eraser') setMode('draw');
      syncUIWithSelectedShape();
      renderAll();
      showToast(state.relaySubMode === 'add' ? '中継点追加モードON' : '通常モード');
    }

    function insertRelayPointAtRow(shape, rawRowFloat, forceFine = false) {
      const step1920 = getMinFineStepY();
      let segIdx = -1;
      for (let k = 0; k < shape.nodes.length - 1; k++) {
        if (rawRowFloat >= shape.nodes[k].y && rawRowFloat <= shape.nodes[k + 1].y) { segIdx = k; break; }
      }
      if (segIdx < 0 || shape.nodes[segIdx + 1].y - shape.nodes[segIdx].y < step1920 * 2) return false;

      saveHistory();
      const newY = computeNodeSnappedY(rawRowFloat, shape.nodes[segIdx].y + step1920, shape.nodes[segIdx + 1].y - step1920, shape.nodes[segIdx].y, shape.nodes[segIdx + 1].y, forceFine);
      const { leftCol, rightCol } = evaluateSegmentEdgesAtTau(shape.nodes[segIdx], shape.nodes[segIdx + 1], (newY - shape.nodes[segIdx].y) / (shape.nodes[segIdx + 1].y - shape.nodes[segIdx].y));
      shape.nodes.splice(segIdx + 1, 0, { left: snapInt(leftCol, 0, GRID_COLS - 1), right: Math.max(snapInt(leftCol, 0, GRID_COLS - 1) + 1, snapInt(rightCol, 1, GRID_COLS)), y: newY, curveMode: shape.nodes[segIdx].curveMode });
      state.activeNodeIndex = segIdx + 1;
      syncUIWithSelectedShape();
      renderAll();
      triggerAutoSave();
      return true;
    }

    function renderLayerList() {
      const container = document.getElementById('layerListContainer');
      document.getElementById('lblLayerCount').textContent = `(${state.shapes.length})`;
      container.innerHTML = '';
      if (state.shapes.length === 0) {
        container.innerHTML = `<div class="text-[11px] text-slate-500 py-2 text-center">図形がありません</div>`;
        return;
      }
      for (let i = state.shapes.length - 1; i >= 0; i--) {
        const sh = state.shapes[i];
        const row = document.createElement('div');
        row.className = `layer-item flex items-center justify-between gap-1.5 px-2 py-1.5 rounded-lg border text-xs transition cursor-pointer ${state.selectedShapeIds.includes(sh.id) ? 'selected' : 'bg-slate-900 border-slate-800'}`;
        row.innerHTML = `
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <input type="checkbox" data-act="check" ${state.selectedShapeIds.includes(sh.id) ? 'checked' : ''} class="w-3.5 h-3.5 rounded accent-sky-400 cursor-pointer" />
            <span class="w-3 h-3 rounded-sm shrink-0" style="background:${(COLORS[sh.color] || COLORS.green).hex}"></span>
            <span class="truncate font-medium">${(COLORS[sh.color] || COLORS.green).name} (幅:${sh.nodes[0].right - sh.nodes[0].left})</span>
          </div>`;
        row.addEventListener('click', (e) => {
          if (e.target.dataset.act === 'check') { toggleShapeSelection(sh.id); return; }
          selectSingleShape(sh.id, 0); renderAll();
        });
        container.appendChild(row);
      }
    }

    function copySelectedShape() {
      const selected = getSelectedShapes();
      if (selected.length === 0) return;
      state.clipboardShapes = selected.map(sh => JSON.parse(JSON.stringify(sh)));
      syncUIWithSelectedShape();
      showToast('コピーしました');
    }

    function pasteClipboardShape() {
      if (state.clipboardShapes.length === 0) return;
      saveHistory();
      const newIds = [];
      for (const src of state.clipboardShapes) {
        const s = normalizeShape({ ...src, id: 'shape_' + Date.now() + '_' + Math.floor(Math.random() * 1000) }, state.gridRows);
        state.shapes.push(s);
        newIds.push(s.id);
      }
      state.selectedShapeIds = newIds;
      state.activeShapeId = newIds[0];
      syncUIWithSelectedShape();
      renderAll();
      triggerAutoSave();
    }

    function saveSelectedShapeAsTemplate() {
      const sh = getActiveShape();
      if (!sh) return;
      state.templates.push({ id: 'tpl_' + Date.now(), name: `${(COLORS[sh.color] || COLORS.green).name}テンプレート`, color: sh.color, nodesRatio: sh.nodes.map(n => ({ left: n.left, right: n.right, yRatio: n.y / state.gridRows, curveMode: n.curveMode })) });
      renderTemplateList();
      saveTemplatesToStorage();
      showToast('テンプレート保存しました');
    }

    function applyTemplate(tpl) {
      saveHistory();
      const s = normalizeShape({ id: 'shape_' + Date.now(), color: tpl.color, nodes: tpl.nodesRatio.map(nr => ({ left: nr.left, right: nr.right, y: nr.yRatio * state.gridRows, curveMode: nr.curveMode })) }, state.gridRows);
      state.shapes.push(s);
      selectSingleShape(s.id, 0);
      renderAll();
      triggerAutoSave();
    }

    function renderTemplateList() {
      const container = document.getElementById('templateListContainer');
      document.getElementById('lblTemplateCount').textContent = `${state.templates.length}件`;
      container.innerHTML = '';
      state.templates.forEach(tpl => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between gap-1.5 px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs';
        row.innerHTML = `<span class="truncate">${tpl.name}</span><button class="px-2 py-0.5 rounded bg-sky-500/20 text-sky-300">追加</button>`;
        row.querySelector('button').addEventListener('click', () => applyTemplate(tpl));
        container.appendChild(row);
      });
    }

    function saveTemplatesToStorage() { localStorage.setItem(STORAGE_KEY_TEMPLATES, JSON.stringify(state.templates)); }
    function saveSavedPaletteList() { localStorage.setItem(STORAGE_KEY_SAVED_PALETTES, JSON.stringify(state.savedPalettes)); renderSavedPaletteList(); }
    function renderSavedPaletteList() {
      const container = document.getElementById('savedPaletteListContainer');
      if (!container) return;
      container.innerHTML = '';
      state.savedPalettes.forEach(p => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between gap-1.5 px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs';
        row.innerHTML = `<span class="truncate">${p.name}</span><button class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">読込</button>`;
        row.querySelector('button').addEventListener('click', () => {
          saveHistory();
          state.shapes = p.shapes.map(s => normalizeShape(s, p.gridRows));
          renderAll();
        });
        container.appendChild(row);
      });
    }

    let autoSaveTimer = null;
    function triggerAutoSave() {
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        try {
          localStorage.setItem(STORAGE_KEY_PALETTE, JSON.stringify({ gridRows: state.gridRows, shapes: state.shapes, grid: state.grid }));
        } catch(e){}
      }, 250);
    }

    async function selectAutoSaveFolder() {
      if (!window.showDirectoryPicker) { downloadPaletteJson(); return; }
      try {
        state.directoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        document.getElementById('autoSaveBadge').textContent = `自動保存: 📁 ${state.directoryHandle.name}`;
        showToast('フォルダ設定完了');
      } catch(e){}
    }

    function downloadPaletteJson() {
      const blob = new Blob([JSON.stringify({ gridRows: state.gridRows, shapes: state.shapes }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'palette.json'; a.click();
    }

    function getCanvasMousePos(canvas, evt) {
      const rect = canvas.getBoundingClientRect();
      return { x: (evt.clientX - rect.left) * (PALETTE_LOGICAL_W / rect.width), y: (evt.clientY - rect.top) * (PALETTE_LOGICAL_H / rect.height) };
    }

    const dragState = { active: false, type: null, nodeIndex: 0, moved: false, mutated: false, pendingSnapshot: null, startGridCol: 0, startGridRow: 0, initialSelectedSnapshots: [] };

    function updateHoverState(pos, gridPt, shiftKey = false) {
      hoverState.inside = true; hoverState.px = pos.x; hoverState.py = pos.y; hoverState.col = gridPt.col; hoverState.row = gridPt.row; hoverState.type = null;
      const lblHover = document.getElementById('lblHoverTarget');
      const activeShape = getActiveShape();

      if (state.mode === 'pan') { paletteCanvas.style.cursor = 'grab'; return; }
      if (state.mode === 'eraser') {
        paletteCanvas.style.cursor = 'pointer';
        const relayHit = findRelayNodeAtCanvasPos(pos.x, pos.y);
        if (relayHit) { hoverState.type = 'eraseRelay'; hoverState.shapeId = relayHit.shape.id; hoverState.nodeIndex = relayHit.nodeIndex; hoverState.label = '削除'; return; }
        return;
      }

      if (activeShape) {
        for (const k of [state.activeNodeIndex, ...activeShape.nodes.map((_, i) => i).filter(i => i !== state.activeNodeIndex)]) {
          const zone = hitTestNodeBox(activeShape.nodes[k], pos.x, pos.y);
          if (zone) {
            paletteCanvas.style.cursor = zone === 'center' ? 'move' : 'ew-resize';
            hoverState.type = zone === 'left' ? 'handleLeft' : (zone === 'right' ? 'handleRight' : 'handleCenter');
            hoverState.shapeId = activeShape.id; hoverState.nodeIndex = k;
            if (lblHover) lblHover.textContent = hoverState.label;
            return;
          }
        }
      }

      if (state.relaySubMode === 'add' && activeShape && isPointInsideShape(activeShape, gridPt.col, gridPt.row)) {
        hoverState.type = 'relayAdd'; hoverState.shapeId = activeShape.id;
        hoverState.insertY = computeNodeSnappedY(gridPt.row, activeShape.nodes[0].y + 1, activeShape.nodes[activeShape.nodes.length-1].y - 1, activeShape.nodes[0].y, null, shiftKey);
        hoverState.insertLeft = activeShape.nodes[0].left; hoverState.insertRight = activeShape.nodes[0].right;
        return;
      }

      for (let i = state.shapes.length - 1; i >= 0; i--) {
        if (isPointInsideShape(state.shapes[i], gridPt.col, gridPt.row)) {
          paletteCanvas.style.cursor = 'pointer'; hoverState.type = 'shape'; hoverState.shapeId = state.shapes[i].id;
          return;
        }
      }
      paletteCanvas.style.cursor = 'crosshair';
      if (lblHover) lblHover.textContent = `カーソル位置 X:${Math.floor(gridPt.col)+1}, Y:${Math.floor(gridPt.row)+1}`;
    }

    paletteCanvas.addEventListener('pointerdown', (evt) => {
      evt.preventDefault();
      paletteCanvas.setPointerCapture(evt.pointerId);
      const pos = getCanvasMousePos(paletteCanvas, evt);
      const gridPt = paletteXYToGrid(pos.x, pos.y);

      if (state.mode === 'eraser') {
        dragState.active = true; dragState.type = 'erase';
        if (findRelayNodeAtCanvasPos(pos.x, pos.y)) {
          const hit = findRelayNodeAtCanvasPos(pos.x, pos.y);
          hit.shape.nodes.splice(hit.nodeIndex, 1);
        }
        renderAll();
        return;
      }

      const activeShape = getActiveShape();
      if (activeShape) {
        for (const k of [state.activeNodeIndex, ...activeShape.nodes.map((_, i) => i).filter(i => i !== state.activeNodeIndex)]) {
          if (hitTestNodeBox(activeShape.nodes[k], pos.x, pos.y)) {
            state.activeNodeIndex = k;
            dragState.active = true; dragState.type = 'nodeCenter'; dragState.nodeIndex = k;
            dragState.pendingSnapshot = createCurrentSnapshot();
            return;
          }
        }
      }

      if (state.relaySubMode === 'add' && activeShape && isPointInsideShape(activeShape, gridPt.col, gridPt.row)) {
        insertRelayPointAtRow(activeShape, gridPt.row, evt.shiftKey);
        return;
      }

      for (let i = state.shapes.length - 1; i >= 0; i--) {
        const sh = state.shapes[i];
        if (isPointInsideShape(sh, gridPt.col, gridPt.row)) {
          selectSingleShape(sh.id, 0);
          dragState.active = true; dragState.type = 'moveShapes';
          dragState.pendingSnapshot = createCurrentSnapshot();
          dragState.startGridCol = Math.round(gridPt.col);
          dragState.startGridRow = Math.round(gridPt.row);
          dragState.initialSelectedSnapshots = getSelectedShapes().map(s => ({ id: s.id, nodes: JSON.parse(JSON.stringify(s.nodes)) }));
          renderAll();
          return;
        }
      }

      // 新規作成
      const snapBefore = createCurrentSnapshot();
      const w = Math.min(GRID_COLS, Math.max(1, state.lastUsedWidth));
      const startLeft = snapInt(Math.floor(gridPt.col) - Math.floor((w - 1) / 2), 0, GRID_COLS - w);
      const newShape = normalizeShape({
        id: 'shape_' + Date.now(),
        color: state.currentColor,
        nodes: [{ left: startLeft, right: startLeft + w, y: 0, curveMode: state.currentCurveMode }, { left: startLeft, right: startLeft + w, y: Math.max(1, snapInt(gridPt.row, 1, state.gridRows)), curveMode: 'straight' }]
      }, state.gridRows);
      state.shapes.push(newShape);
      selectSingleShape(newShape.id, 1);
      dragState.active = true; dragState.type = 'newShape'; dragState.nodeIndex = 1; dragState.pendingSnapshot = snapBefore;
      renderAll();
    });

    paletteCanvas.addEventListener('pointermove', (evt) => {
      const pos = getCanvasMousePos(paletteCanvas, evt);
      const gridPt = paletteXYToGrid(pos.x, pos.y);
      if (!dragState.active) { updateHoverState(pos, gridPt, evt.shiftKey); renderPalette(); return; }

      if (dragState.type === 'moveShapes') {
        const dCol = Math.round(gridPt.col) - dragState.startGridCol;
        const dRow = Math.round(gridPt.row) - dragState.startGridRow;
        for (const snap of dragState.initialSelectedSnapshots) {
          const sh = state.shapes.find(s => s.id === snap.id);
          if (!sh) continue;
          for (let k = 0; k < sh.nodes.length; k++) {
            sh.nodes[k].left = snap.nodes[k].left + dCol;
            sh.nodes[k].right = snap.nodes[k].right + dCol;
            sh.nodes[k].y = snapFine1920(snap.nodes[k].y + dRow, 0, state.gridRows, state.gridRows);
          }
        }
        renderAll();
        return;
      }

      const shape = getActiveShape();
      if (!shape) return;
      const node = shape.nodes[dragState.nodeIndex];
      if (!node) return;

      if (dragState.type === 'nodeCenter' || dragState.type === 'newShape') {
        const w = node.right - node.left;
        node.left = snapInt(Math.round(gridPt.col), 0, GRID_COLS - w);
        node.right = node.left + w;
        node.y = computeNodeSnappedY(gridPt.row, 0, state.gridRows, null, null, evt.shiftKey);
        renderAll();
      }
    });

    function finishPointerDrag() {
      if (!dragState.active) return;
      if (dragState.pendingSnapshot) pushSnapshotToHistory(dragState.pendingSnapshot);
      dragState.active = false; dragState.type = null; dragState.pendingSnapshot = null;
      renderAll();
      triggerAutoSave();
    }

    paletteCanvas.addEventListener('pointerup', finishPointerDrag);
    paletteCanvas.addEventListener('pointercancel', finishPointerDrag);

    function setMode(newMode) {
      state.mode = newMode;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === newMode));
      syncUIWithSelectedShape();
      renderAll();
    }

    document.querySelectorAll('.tool-btn').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
    document.getElementById('btnGridMinus').addEventListener('click', () => stepGridDivision(-1));
    document.getElementById('btnGridPlus').addEventListener('click', () => stepGridDivision(1));
    document.getElementById('btnZoomIn').addEventListener('click', () => stepPaletteZoom(20));
    document.getElementById('btnZoomOut').addEventListener('click', () => stepPaletteZoom(-20));
    document.getElementById('btnZoomReset').addEventListener('click', () => setPaletteZoom(100, false));
    document.getElementById('rngPaletteZoom').addEventListener('input', (e) => setPaletteZoom(parseInt(e.target.value, 10), true));

    document.querySelectorAll('.color-swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        state.currentColor = btn.dataset.color;
        document.querySelectorAll('.color-swatch').forEach(b => b.classList.toggle('active', b.dataset.color === state.currentColor));
      });
    });

    document.querySelectorAll('.curve-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.currentCurveMode = btn.dataset.curve;
        const selected = getSelectedShapes();
        if (selected.length > 0) {
          saveHistory();
          selected.forEach(sh => sh.nodes.forEach(n => n.curveMode = state.currentCurveMode));
          renderAll();
        }
        syncUIWithSelectedShape();
      });
    });

    document.getElementById('btnAddRelayPoint').addEventListener('click', toggleRelayAddMode);
    document.getElementById('btnCopyShape').addEventListener('click', copySelectedShape);
    document.getElementById('btnPasteShape').addEventListener('click', pasteClipboardShape);
    document.getElementById('btnSaveTemplate').addEventListener('click', saveSelectedShapeAsTemplate);
    document.getElementById('btnSelectFolder').addEventListener('click', selectAutoSaveFolder);
    document.getElementById('btnDownloadJson').addEventListener('click', downloadPaletteJson);
    document.getElementById('btnUndo').addEventListener('click', undo);
    document.getElementById('btnRedo').addEventListener('click', redo);

    document.getElementById('btnClearAll').addEventListener('click', () => {
      saveHistory();
      state.grid = Array.from({ length: state.gridRows }, () => Array(GRID_COLS).fill(null));
      state.shapes = [];
      selectSingleShape(null);
      renderAll();
    });

    document.getElementById('btnExportPreview').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'preview.png';
      link.href = previewCanvas.toDataURL('image/png');
      link.click();
    });

    function initApp() {
      try {
        const t = localStorage.getItem(STORAGE_KEY_TEMPLATES);
        if (t) state.templates = JSON.parse(t);
        const s = localStorage.getItem(STORAGE_KEY_PALETTE);
        if (s) {
          const p = JSON.parse(s);
          state.gridRows = p.gridRows || 16;
          state.shapes = (p.shapes || []).map(sh => normalizeShape(sh, state.gridRows));
        }
      } catch(e){}
      updateGridDivisionUI();
      renderTemplateList();
      renderSavedPaletteList();
      renderAll();
    }
    window.onload = initApp;
  </script>
</body>
</html>

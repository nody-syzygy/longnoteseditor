<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スライド造形ツール (16レーン・レーン外非表示対応)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: #090b10;
      color: #f1f5f9;
      user-select: none;
      -webkit-user-select: none;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    input[type="range"] { accent-color: #38bdf8; }
    .canvas-shadow { box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08); }
    .tool-btn.active { background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); border-color: #7dd3fc; color: #ffffff; box-shadow: 0 0 15px rgba(56, 189, 248, 0.35); }
    .curve-btn.active { background: linear-gradient(135deg, #c026d3 0%, #7c3aed 100%); border-color: #f0abfc; color: #ffffff; box-shadow: 0 0 12px rgba(217, 70, 239, 0.4); }
    .color-swatch.active { transform: scale(1.08); box-shadow: 0 0 0 2px #090b10, 0 0 0 4px #ffffff, 0 0 16px currentColor; }
    .layer-item.selected { background: rgba(14, 165, 233, 0.18); border-color: rgba(56, 189, 248, 0.65); }
    .relay-mode-btn.active-add { background: linear-gradient(135deg, #c026d3 0%, #9333ea 100%); border-color: #f0abfc; color: #ffffff; box-shadow: 0 0 14px rgba(217, 70, 239, 0.5); }
    .snap-btn.active { background: #0284c7; border-color: #7dd3fc; color: #ffffff; }
    .tap-curve-btn.active { background: linear-gradient(135deg, #a21caf 0%, #7e22ce 100%); border-color: #f0abfc; color: #ffffff; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#090b10] text-slate-100">

  <!-- Top Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur sticky top-0 z-30 px-4 py-2">
    <div class="max-w-[1800px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-400 via-[#52FFBD] to-[#FFCD42] flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3L2 21h20L12 3z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M12 3l-5 18M12 3l5 18" />
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
            スライド造形ツール
            <span id="headerGridBadge" class="text-xs font-medium px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-500/30">16レーン パレット</span>
          </h1>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button id="btnClearAll" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-950/60 hover:bg-rose-900/80 text-rose-200 border border-rose-800/60 transition">🗑 全消去</button>
        <button id="btnExportPreview" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition">⬇ プレビュー画像保存</button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-[1440px] w-full mx-auto p-1.5 sm:p-3 md:p-4 flex flex-col gap-2.5 sm:gap-4">

    <!-- 1. PREVIEW SECTION -->
    <section class="w-full flex flex-col bg-slate-900/80 border border-slate-800 rounded-2xl p-2 sm:p-4">
      <div class="flex flex-wrap items-center justify-between gap-1.5 sm:gap-2 mb-1.5 sm:mb-2">
        <div class="flex items-center gap-2 sm:gap-3">
          <h2 class="text-xs sm:text-base font-bold text-white">プレビュー (左右各2レーン外非表示)</h2>
          <span id="statusToast" class="text-[10px] sm:text-xs text-sky-400 font-medium bg-slate-950/80 border border-slate-800 px-2 py-0.5 rounded-full">準備完了</span>
        </div>
      </div>
      <div class="w-full max-w-[1000px] mx-auto relative rounded-xl overflow-hidden canvas-shadow bg-black flex items-center justify-center">
        <canvas id="previewCanvas" width="1120" height="630" class="w-full h-auto block"></canvas>
      </div>
    </section>

    <!-- 2. MIDDLE SECTION -->
    <section class="w-full max-w-[1160px] mx-auto grid grid-cols-[68px_minmax(0,1fr)_68px] sm:grid-cols-[108px_minmax(0,1fr)_108px] md:grid-cols-[124px_minmax(0,1fr)_124px] gap-1.5 sm:gap-3 items-start">

      <!-- LEFT TOOLBAR -->
      <div class="flex flex-col gap-1.5 sm:gap-2 bg-slate-900/80 border border-slate-800 rounded-xl sm:rounded-2xl p-1.5 sm:p-2">
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg p-1 flex flex-col gap-1">
          <span class="text-[9px] font-bold uppercase tracking-wider text-slate-300 text-center">履歴</span>
          <button id="btnUndo" class="w-full py-1 rounded text-[10px] font-bold bg-slate-800 hover:bg-slate-700 text-slate-100 disabled:opacity-35">戻る</button>
          <button id="btnRedo" class="w-full py-1 rounded text-[10px] font-bold bg-slate-800 hover:bg-slate-700 text-slate-100 disabled:opacity-35">進む</button>
        </div>
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg p-1 flex flex-col gap-1">
          <span class="text-[9px] font-bold uppercase tracking-wider text-slate-300 text-center">ツール</span>
          <button data-mode="draw" class="tool-btn active w-full py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-[10px] font-bold">描画</button>
          <button data-mode="eraser" class="tool-btn w-full py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-[10px] font-bold">消しゴム</button>
        </div>
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg p-1 flex flex-col gap-1">
          <span class="text-[9px] font-bold uppercase tracking-wider text-slate-300 text-center">中継点</span>
          <span id="lblSelectedNodeInfo" class="text-[9px] font-mono text-amber-300 truncate text-center">未選択</span>
          <button id="btnAddRelayPoint" class="relay-mode-btn w-full py-1.5 rounded-lg bg-fuchsia-600/20 border border-fuchsia-500/40 text-fuchsia-200 text-[10px] font-bold">＋中継追加</button>
        </div>
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg p-1 flex flex-col gap-1">
          <span class="text-[9px] font-bold uppercase tracking-wider text-slate-300 text-center">編集</span>
          <button id="btnCopyShape" class="w-full py-1 rounded bg-slate-800 text-[10px]">コピー</button>
          <button id="btnPasteShape" class="w-full py-1 rounded bg-slate-800 text-[10px]">貼付</button>
          <button id="btnDeleteShape" class="w-full py-1 rounded bg-rose-950 text-[10px] text-rose-200">削除</button>
        </div>
      </div>

      <!-- CENTER: PALETTE -->
      <div class="flex flex-col items-center justify-between bg-slate-900/80 border border-slate-800 rounded-xl p-1.5 sm:p-3 w-full">
        <div class="w-full flex items-center justify-between gap-1.5 mb-1.5">
          <h2 class="text-xs sm:text-base font-bold text-white">パレット (<span id="lblPaletteTitleDims">16×16</span>)</h2>
          <div class="flex items-center gap-1 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1">
            <button id="btnZoomOut" class="w-5 h-5 rounded bg-slate-800 text-xs font-bold">－</button>
            <input type="range" id="rngPaletteZoom" min="50" max="350" step="10" value="100" class="w-16 h-1.5" />
            <button id="btnZoomIn" class="w-5 h-5 rounded bg-slate-800 text-xs font-bold">＋</button>
          </div>
        </div>
        <div id="paletteViewport" class="relative w-full overflow-auto rounded-lg bg-[#05070b] border border-slate-800 p-1.5">
          <div id="paletteZoomInner" class="mx-auto relative">
            <canvas id="paletteCanvas" width="720" height="760" class="rounded-lg canvas-shadow bg-[#07090e] cursor-crosshair touch-none block"></canvas>
          </div>
        </div>
        <div class="w-full mt-1.5 flex items-center justify-between text-[10px] bg-slate-950 border border-slate-800 rounded-lg px-2 py-1">
          <span id="lblHoverTarget" class="text-slate-300">カーソル位置:</span>
          <span id="lblCursorCell" class="font-mono text-sky-300 font-bold">X: - , Y: -</span>
        </div>
      </div>

      <!-- RIGHT TOOLBAR -->
      <div class="flex flex-col gap-1.5 sm:gap-2 bg-slate-900/80 border border-slate-800 rounded-xl p-1.5 sm:p-2">
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg p-1 flex flex-col items-center gap-1.5">
          <span class="text-[9px] font-bold uppercase tracking-wider text-slate-300">色選択</span>
          <div class="flex flex-col items-center gap-1.5 py-1 w-full" id="colorPaletteContainer">
            <button data-color="green" class="color-swatch active w-8 h-8 rounded-lg border-2 border-emerald-400" style="background:#00e676;"></button>
            <button data-color="orange" class="color-swatch w-8 h-8 rounded-lg border-2 border-amber-300" style="background:#FFCD42;"></button>
            <button data-color="yellowgreen" class="color-swatch w-8 h-8 rounded-lg border-2 border-teal-300" style="background:#52FFBD;"></button>
            <button data-color="yellow" class="color-swatch w-8 h-8 rounded-lg border-2 border-yellow-200" style="background:#FEF7A9;"></button>
          </div>
        </div>
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg p-1 flex flex-col items-center gap-1">
          <span class="text-[9px] font-bold uppercase tracking-wider text-slate-300">分割数</span>
          <button id="btnGridPlus" class="w-full py-1 bg-slate-800 text-xs font-bold">＋</button>
          <span id="lblCurrentGridRows" class="text-xs font-mono font-bold text-sky-300">16</span>
          <button id="btnGridMinus" class="w-full py-1 bg-slate-800 text-xs font-bold">－</button>
        </div>
        <div class="bg-slate-950/70 border border-slate-800/90 rounded-lg p-1 flex flex-col gap-1">
          <span class="text-[9px] font-bold uppercase tracking-wider text-slate-300 text-center">カーブ (区間)</span>
          <span id="lblCurveModeName" class="text-[9px] font-mono text-fuchsia-300 font-bold text-center truncate">直線 ｜｜</span>
          <div class="flex flex-col gap-1">
            <button data-curve="straight" class="curve-btn active w-full py-1 rounded bg-slate-800 text-[10px]">｜ ｜</button>
            <button data-curve="left" class="curve-btn w-full py-1 rounded bg-slate-800 text-[10px]">（ （</button>
            <button data-curve="right" class="curve-btn w-full py-1 rounded bg-slate-800 text-[10px]">） ）</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const GRID_COLS = 16; // 16レーン (外側2レーン + 中央12レーン + 外側2レーン)
    const MAX_FINE_DIVISIONS = 1920;
    const ALLOWED_ROW_DIVISIONS = [4, 8, 16, 32, 64, 128, 192, 1920];
    const STORAGE_KEY_PALETTE = 'dot_persp_palette_16l_v1';

    const NODE_BOX_HALF_H = 18;
    const NODE_EDGE_HIT_W = 14;

    const COLORS = {
      green: { id: 'green', name: 'ガイド', hex: '#00e676', rgb: [0, 230, 118], fadeToTransparent: true },
      yellowgreen: { id: 'yellowgreen', name: 'スライド', hex: '#52FFBD', rgb: [82, 255, 189], fadeToTransparent: false },
      yellow: { id: 'yellow', name: '金スライド', hex: '#FEF7A9', rgb: [254, 247, 169], fadeToTransparent: false },
      orange: { id: 'orange', name: '金ガイド', hex: '#FFCD42', rgb: [255, 205, 66], fadeToTransparent: true }
    };

    const CURVE_MODES = { straight: '直線 ｜ ｜', left: 'カーブ （ （', right: 'カーブ ） ）' };

    const PERSP_GEOM = {
      topY: 0.118, topLeftX: 0.480, topRightX: 0.520, botY: 0.813, botLeftX: 0.152, botRightX: 0.848, numMainLanes: 6,
      verticalStopsFromTop: [0.0000, 0.0291, 0.0676, 0.1180, 0.1842, 0.2719, 0.3885, 0.5942, 0.8317, 1.0000]
    };

    const SMOOTH_PERSP_K = (() => {
      const stops = PERSP_GEOM.verticalStopsFromTop;
      let logRatioSum = 0;
      for (let i = 0; i < stops.length - 2; i++) {
        logRatioSum += Math.log((stops[i+2] - stops[i+1]) / (stops[i+1] - stops[i]));
      }
      return (logRatioSum / (stops.length - 3)) * (stops.length - 1);
    })();

    const state = {
      mode: 'draw',
      relaySubMode: null,
      fine1920Snap: false,
      tapNodeToCycleCurve: true,
      paletteZoom: 100,
      gridRows: 16,
      lastUsedWidth: 2,
      currentColor: 'green',
      currentCurveMode: 'straight',
      slideOpacity: 0.85,
      guideOpacity: 0.85,
      grid: Array.from({ length: 16 }, () => Array(GRID_COLS).fill(null)),
      shapes: [],
      selectedShapeIds: [],
      activeShapeId: null,
      activeNodeIndex: 0,
      clipboardShapes: [],
      history: [],
      redoStack: []
    };

    const hoverState = { inside: false, col: 0, row: 0, px: 0, py: 0, type: null, shapeId: null, nodeIndex: -1, label: '' };

    const paletteCanvas = document.getElementById('paletteCanvas');
    const paletteCtx = paletteCanvas.getContext('2d');
    const previewCanvas = document.getElementById('previewCanvas');
    const previewCtx = previewCanvas.getContext('2d');
    const paletteViewport = document.getElementById('paletteViewport');
    const paletteZoomInner = document.getElementById('paletteZoomInner');

    const PALETTE_LOGICAL_W = 720;
    const PALETTE_LOGICAL_H = 760;
    const PALETTE_PAD = { left: 48, right: 24, top: 28, bottom: 38 };
    const PLOT_W = PALETTE_LOGICAL_W - PALETTE_PAD.left - PALETTE_PAD.right;
    const PLOT_H = PALETTE_LOGICAL_H - PALETTE_PAD.top - PALETTE_PAD.bottom;
    const CELL_W = PLOT_W / GRID_COLS;

    function setPaletteZoom(newZoomPct) {
      const clamped = Math.max(50, Math.min(350, Math.round(newZoomPct / 10) * 10));
      state.paletteZoom = clamped;
      document.getElementById('rngPaletteZoom').value = String(clamped);
      const scale = clamped / 100;
      const targetW = Math.round(560 * scale);
      const targetH = Math.round(targetW * (PALETTE_LOGICAL_H / PALETTE_LOGICAL_W));
      paletteZoomInner.style.width = `${targetW}px`;
      paletteZoomInner.style.height = `${targetH}px`;
      paletteCanvas.style.width = `${targetW}px`;
      paletteCanvas.style.height = `${targetH}px`;
      renderPalette();
    }

    function getCellH() { return PLOT_H / state.gridRows; }
    function getMinFineStepY() { return state.gridRows / MAX_FINE_DIVISIONS; }
    function snapFine1920(val, min, max) {
      const step = getMinFineStepY();
      return Math.max(min, Math.min(max, Number((Math.round((Number.isFinite(val) ? val : min) / step) * step).toFixed(6))));
    }

    function normalizeShape(raw, rows = state.gridRows) {
      const color = COLORS[raw.color] ? raw.color : 'green';
      const nodes = (raw.nodes || []).map(n => ({
        left: snapInt(n.left ?? 0, 0, GRID_COLS - 1),
        right: Math.max(snapInt(n.left ?? 0, 0, GRID_COLS - 1) + 1, snapInt(n.right ?? 1, 1, GRID_COLS)),
        y: snapFine1920(n.y ?? 0, 0, rows),
        curveMode: ['straight', 'left', 'right'].includes(n.curveMode) ? n.curveMode : 'straight'
      }));
      return { id: raw.id || ('shape_' + Date.now() + '_' + Math.floor(Math.random() * 1000)), color, nodes };
    }

    function createSnapshot() {
      return {
        gridRows: state.gridRows,
        shapes: JSON.parse(JSON.stringify(state.shapes)),
        selectedShapeIds: [...state.selectedShapeIds],
        activeShapeId: state.activeShapeId,
        activeNodeIndex: state.activeNodeIndex
      };
    }

    function saveHistory() {
      state.history.push(createSnapshot());
      if (state.history.length > 50) state.history.shift();
      state.redoStack = [];
      updateHistoryButtons();
    }

    function applySnapshot(snap) {
      if (!snap) return;
      state.gridRows = snap.gridRows;
      state.shapes = snap.shapes.map(s => normalizeShape(s, snap.gridRows));
      state.selectedShapeIds = [...snap.selectedShapeIds];
      state.activeShapeId = snap.activeShapeId;
      state.activeNodeIndex = snap.activeNodeIndex;
      updateHistoryButtons();
      renderAll();
    }

    function undo() {
      if (state.history.length === 0) return;
      const cur = createSnapshot();
      state.redoStack.push(cur);
      applySnapshot(state.history.pop());
    }

    function redo() {
      if (state.redoStack.length === 0) return;
      const cur = createSnapshot();
      state.history.push(cur);
      applySnapshot(state.redoStack.pop());
    }

    function updateHistoryButtons() {
      document.getElementById('btnUndo').disabled = state.history.length === 0;
      document.getElementById('btnRedo').disabled = state.redoStack.length === 0;
    }

    function gridToPaletteXY(col, rowFromBot) {
      return { x: PALETTE_PAD.left + col * CELL_W, y: PALETTE_PAD.top + (state.gridRows - rowFromBot) * getCellH() };
    }

    function paletteXYToGrid(px, py) {
      const col = (px - PALETTE_PAD.left) / CELL_W;
      const rowFromTop = (py - PALETTE_PAD.top) / getCellH();
      return { col: Math.max(0, Math.min(GRID_COLS, col)), row: Math.max(0, Math.min(state.gridRows, state.gridRows - rowFromTop)) };
    }

    function snapInt(val, min, max) { return Math.max(min, Math.min(max, Math.round(Number.isFinite(val) ? val : min))); }

    function getNodeBoxPixelRect(node) {
      const ptL = gridToPaletteXY(node.left, node.y);
      const ptR = gridToPaletteXY(node.right, node.y);
      return { x1: ptL.x, x2: ptR.x, yCenter: ptL.y, y1: ptL.y - NODE_BOX_HALF_H, y2: ptL.y + NODE_BOX_HALF_H, width: ptR.x - ptL.x, height: NODE_BOX_HALF_H * 2 };
    }

    function hitTestNodeBox(node, px, py) {
      const rect = getNodeBoxPixelRect(node);
      if (py < rect.y1 - 5 || py > rect.y2 + 5) return null;
      const edgeZone = Math.min(NODE_EDGE_HIT_W, Math.max(7, rect.width * 0.28));
      if (px >= rect.x1 - NODE_EDGE_HIT_W && px <= rect.x1 + edgeZone) return 'left';
      if (px >= rect.x2 - edgeZone && px <= rect.x2 + NODE_EDGE_HIT_W) return 'right';
      if (px > rect.x1 + edgeZone && px < rect.x2 - edgeZone) return 'center';
      return null;
    }

    function evaluateSingleEdgeAtTau(x0, x1, mode, localTau) {
      if (x0 === x1 || mode === 'straight') return x0 + (x1 - x0) * localTau;
      if (mode === 'right') return x0 + (x1 - x0) * (1 - (1 - localTau) * (1 - localTau));
      if (mode === 'left') return x0 + (x1 - x0) * (localTau * localTau);
      return x0 + (x1 - x0) * localTau;
    }

    function evaluateSegmentEdgesAtTau(node0, node1, localTau) {
      const mode = node0.curveMode || 'straight';
      return {
        leftCol: evaluateSingleEdgeAtTau(node0.left, node1.left, mode, localTau),
        rightCol: evaluateSingleEdgeAtTau(node0.right, node1.right, mode, localTau)
      };
    }

    function evaluateSegmentPoint(node0, node1, s, localTau) {
      const { leftCol, rightCol } = evaluateSegmentEdgesAtTau(node0, node1, localTau);
      return { col: leftCol + s * (rightCol - leftCol), row: node0.y + localTau * (node1.y - node0.y) };
    }

    function getShapeAlphaAtRow(shape, row) {
      const colorObj = COLORS[shape.color] || COLORS.green;
      const totalSpan = Math.max(0.001, shape.nodes[shape.nodes.length - 1].y - shape.nodes[0].y);
      const overallTau = Math.max(0, Math.min(1, (row - shape.nodes[0].y) / totalSpan));
      return colorObj.fadeToTransparent ? state.guideOpacity * (1 - overallTau) : state.slideOpacity;
    }

    function isPointInsideShape(shape, col, row) {
      const nodes = shape.nodes;
      if (!nodes || nodes.length < 2 || row < nodes[0].y || row > nodes[nodes.length - 1].y) return false;
      for (let k = 0; k < nodes.length - 1; k++) {
        const n0 = nodes[k], n1 = nodes[k + 1];
        if (row >= n0.y && row <= n1.y) {
          const localTau = (n1.y - n0.y) <= 0 ? 0 : (row - n0.y) / (n1.y - n0.y);
          const { leftCol, rightCol } = evaluateSegmentEdgesAtTau(n0, n1, localTau);
          if (col >= Math.min(leftCol, rightCol) - 0.15 && col <= Math.max(leftCol, rightCol) + 0.15) return true;
        }
      }
      return false;
    }

    function gridToPerspectiveXY(col, rowFromBot) {
      // 16レーン中の「左端2レーン・右端2レーン」をプレビューで非表示にするため、
      // 中央の12レーン（インデックス2〜14付近、あるいはオフセット調整）を画面内に収める。
      // ここでは 0〜15 のうちレーンインデックス 2 〜 14 (実質12レーン分) を基準枠内にマッピングします。
      const innerCol = col - 2.0; // 左右2レーン分(index 0,1)をオフセット
      const u = innerCol / 12.0;
      const vFromTop = 1 - (rowFromBot / state.gridRows);
      const t = (Math.exp(SMOOTH_PERSP_K * vFromTop) - 1) / (Math.exp(SMOOTH_PERSP_K) - 1);
      const W = previewCanvas.width, H = previewCanvas.height;
      const y = (PERSP_GEOM.topY + t * (PERSP_GEOM.botY - PERSP_GEOM.topY)) * H;
      const leftX = (PERSP_GEOM.topLeftX + t * (PERSP_GEOM.botLeftX - PERSP_GEOM.topLeftX)) * W;
      const rightX = (PERSP_GEOM.topRightX + t * (PERSP_GEOM.botRightX - PERSP_GEOM.topRightX)) * W;
      return { x: leftX + u * (rightX - leftX), y };
    }

    function renderPalette() {
      const ctx = paletteCtx;
      const W = PALETTE_LOGICAL_W, H = PALETTE_LOGICAL_H, rows = state.gridRows, cellH = getCellH();
      ctx.setTransform(paletteCanvas.width / W, 0, 0, paletteCanvas.height / H, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#07090e';
      ctx.fillRect(0, 0, W, H);

      const gx0 = PALETTE_PAD.left, gy0 = PALETTE_PAD.top, gw = GRID_COLS * CELL_W, gh = PLOT_H;
      ctx.fillStyle = '#0c1017';
      ctx.fillRect(gx0, gy0, gw, gh);

      for (const shape of state.shapes) drawSmoothShapeOnPalette(ctx, shape);

      // 16レーン区切り線（2レーン目と14レーン目を太線にするなど視覚化）
      ctx.save();
      for (let c = 0; c <= GRID_COLS; c++) {
        const x = gx0 + c * CELL_W;
        ctx.beginPath();
        ctx.moveTo(x, gy0); ctx.lineTo(x, gy0 + gh);
        ctx.strokeStyle = (c === 2 || c === 14) ? '#38bdf8' : 'rgba(148, 163, 184, 0.15)';
        ctx.lineWidth = (c === 2 || c === 14) ? 2.5 : 0.75;
        ctx.stroke();
      }
      ctx.restore();

      if (state.mode === 'draw') {
        for (const sh of getSelectedShapes()) {
          drawShapeHandlesOnPalette(ctx, sh, sh.id === state.activeShapeId);
        }
      }
    }

    function drawNodeRectangleFrame(ctx, node, nodeIndex, totalNodes, isActiveNode) {
      const rect = getNodeBoxPixelRect(node);
      const isStart = nodeIndex === 0, isEnd = nodeIndex === totalNodes - 1;
      const baseColor = isStart ? '#38bdf8' : (isEnd ? '#fbbf24' : '#e879f9');

      ctx.save();
      if (isActiveNode) {
        ctx.fillStyle = 'rgba(217, 70, 239, 0.22)';
        ctx.fillRect(rect.x1, rect.y1, rect.width, rect.height);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.0;
        ctx.strokeRect(rect.x1, rect.y1, rect.width, rect.height);

        const gripW = 6;
        ctx.fillStyle = baseColor;
        ctx.fillRect(rect.x1 - gripW / 2, rect.y1 - 1, gripW, rect.height + 2);
        ctx.fillRect(rect.x2 - gripW / 2, rect.y1 - 1, gripW, rect.height + 2);
      } else {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
        ctx.fillRect(rect.x1, rect.y1 + 4, rect.width, rect.height - 8);
        ctx.strokeStyle = baseColor;
        ctx.lineWidth = 1.8;
        ctx.strokeRect(rect.x1, rect.y1 + 4, rect.width, rect.height - 8);
      }
      ctx.restore();
    }

    function drawSmoothShapeOnPalette(ctx, shape) {
      const nodes = shape.nodes;
      if (!nodes || nodes.length < 2) return;
      ctx.save();
      ctx.beginPath();
      ctx.rect(PALETTE_PAD.left, PALETTE_PAD.top, GRID_COLS * CELL_W, PLOT_H);
      ctx.clip();

      for (let k = 0; k < nodes.length - 1; k++) {
        const n0 = nodes[k], n1 = nodes[k + 1];
        const steps = 30;
        for (let i = 0; i < steps; i++) {
          const tau0 = i / steps, tau1 = (i + 1) / steps;
          const alpha = getShapeAlphaAtRow(shape, n0.y + ((tau0 + tau1) * 0.5) * (n1.y - n0.y));
          if (alpha <= 0.003) continue;

          ctx.beginPath();
          for (let j = 0; j <= 20; j++) {
            const pt = gridToPaletteXY(evaluateSegmentPoint(n0, n1, j / 20, tau0).col, evaluateSegmentPoint(n0, n1, j / 20, tau0).row);
            if (j === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
          }
          for (let j = 20; j >= 0; j--) {
            const pt = gridToPaletteXY(evaluateSegmentPoint(n0, n1, j / 20, tau1).col, evaluateSegmentPoint(n0, n1, j / 20, tau1).row);
            ctx.lineTo(pt.x, pt.y);
          }
          ctx.closePath();
          ctx.fillStyle = `rgba(${COLORS[shape.color].rgb.join(',')},${alpha})`;
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function drawShapeHandlesOnPalette(ctx, shape, isPrimary) {
      const nodes = shape.nodes;
      if (!nodes) return;
      ctx.save();
      for (let k = 0; k < nodes.length; k++) {
        drawNodeRectangleFrame(ctx, nodes[k], k, nodes.length, isPrimary && k === state.activeNodeIndex);
      }
      ctx.restore();
    }

    function renderPreview() {
      const ctx = previewCtx, W = previewCanvas.width, H = previewCanvas.height, rows = state.gridRows;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      // レーン外（左右各2レーン：インデックス0,1および14,15）の領域を除外して描画
      ctx.save();
      const clipLeft = gridToPerspectiveXY(2, 0), clipRight = gridToPerspectiveXY(14, 0);
      const clipTopL = gridToPerspectiveXY(2, rows), clipTopR = gridToPerspectiveXY(14, rows);
      ctx.beginPath();
      ctx.moveTo(clipLeft.x, clipLeft.y); ctx.lineTo(clipRight.x, clipRight.y);
      ctx.lineTo(clipTopR.x, clipTopR.y); ctx.lineTo(clipTopL.x, clipTopL.y);
      ctx.closePath();
      ctx.clip();

      for (const shape of state.shapes) {
        drawSmoothShapeOnPerspective(ctx, shape);
      }
      ctx.restore();

      // 中央12レーン分の白枠レーン線を描画
      ctx.save();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.8;
      for (const t of [0, 1]) {
        const y = (PERSP_GEOM.topY + t * (PERSP_GEOM.botY - PERSP_GEOM.topY)) * H;
        ctx.beginPath();
        ctx.moveTo(gridToPerspectiveXY(2, t * rows).x, y);
        ctx.lineTo(gridToPerspectiveXY(14, t * rows).x, y);
        ctx.stroke();
      }
      for (let i = 0; i <= 6; i++) {
        const laneCol = 2 + i * 2;
        const pTop = gridToPerspectiveXY(laneCol, rows), pBot = gridToPerspectiveXY(laneCol, 0);
        ctx.beginPath(); ctx.moveTo(pTop.x, pTop.y); ctx.lineTo(pBot.x, pBot.y); ctx.stroke();
      }
      ctx.restore();
    }

    function drawSmoothShapeOnPerspective(ctx, shape) {
      const nodes = shape.nodes;
      if (!nodes || nodes.length < 2) return;
      ctx.save();
      for (let k = 0; k < nodes.length - 1; k++) {
        const n0 = nodes[k], n1 = nodes[k + 1];
        const steps = 40;
        for (let i = 0; i < steps; i++) {
          const tau0 = i / steps, tau1 = (i + 1) / steps;
          const alpha = getShapeAlphaAtRow(shape, n0.y + ((tau0 + tau1) * 0.5) * (n1.y - n0.y));
          if (alpha <= 0.003) continue;

          ctx.beginPath();
          for (let j = 0; j <= 20; j++) {
            const pt = gridToPerspectiveXY(evaluateSegmentPoint(n0, n1, j / 20, tau0).col, evaluateSegmentPoint(n0, n1, j / 20, tau0).row);
            if (j === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
          }
          for (let j = 20; j >= 0; j--) {
            const pt = gridToPerspectiveXY(evaluateSegmentPoint(n0, n1, j / 20, tau1).col, evaluateSegmentPoint(n0, n1, j / 20, tau1).row);
            ctx.lineTo(pt.x, pt.y);
          }
          ctx.closePath();
          ctx.fillStyle = `rgba(${COLORS[shape.color].rgb.join(',')},${alpha})`;
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function renderAll() { renderPalette(); renderPreview(); }
    function getActiveShape() { return state.shapes.find(s => s.id === state.activeShapeId) || null; }
    function getSelectedShapes() { const set = new Set(state.selectedShapeIds); return state.shapes.filter(s => set.has(s.id)); }

    function selectSingleShape(shapeId, nodeIdx = 0) {
      state.selectedShapeIds = shapeId ? [shapeId] : [];
      state.activeShapeId = shapeId;
      state.activeNodeIndex = nodeIdx;
      syncUIWithSelectedShape();
    }

    function syncUIWithSelectedShape() {
      const activeShape = getActiveShape();
      let cMode = state.currentCurveMode;
      if (activeShape) {
        const segIdx = Math.min(state.activeNodeIndex, activeShape.nodes.length - 2);
        cMode = activeShape.nodes[segIdx]?.curveMode || 'straight';
      }
      document.querySelectorAll('.curve-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.curve === cMode));
      document.getElementById('lblCurveModeName').textContent = CURVE_MODES[cMode] || CURVE_MODES.straight;
    }

    // ドラッグ＆ドロップ関連
    const dragState = { active: false, type: null, nodeIndex: 0, pendingSnapshot: null, startGridCol: 0, initialNodes: null };

    paletteCanvas.addEventListener('pointerdown', (evt) => {
      evt.preventDefault();
      paletteCanvas.setPointerCapture(evt.pointerId);
      const pos = getCanvasMousePos(paletteCanvas, evt);
      const gridPt = paletteXYToGrid(pos.x, pos.y);

      const activeShape = getActiveShape();
      if (activeShape) {
        for (let k = 0; k < activeShape.nodes.length; k++) {
          const zone = hitTestNodeBox(activeShape.nodes[k], pos.x, pos.y);
          if (zone) {
            state.activeNodeIndex = k;
            dragState.active = true;
            dragState.type = zone; // 'left' | 'right' | 'center'
            dragState.nodeIndex = k;
            dragState.pendingSnapshot = createSnapshot();
            dragState.startGridCol = Math.round(gridPt.col);
            dragState.initialNodes = JSON.parse(JSON.stringify(activeShape.nodes));
            syncUIWithSelectedShape();
            renderAll();
            return;
          }
        }
      }

      // 図形選択
      for (let i = state.shapes.length - 1; i >= 0; i--) {
        if (isPointInsideShape(state.shapes[i], gridPt.col, gridPt.row)) {
          selectSingleShape(state.shapes[i].id, 0);
          dragState.active = true;
          dragState.type = 'moveShape';
          dragState.pendingSnapshot = createSnapshot();
          dragState.startGridCol = Math.round(gridPt.col);
          dragState.initialNodes = JSON.parse(JSON.stringify(state.shapes[i].nodes));
          renderAll();
          return;
        }
      }

      // 新規作成
      const snapBefore = createSnapshot();
      const startLeft = snapInt(Math.floor(gridPt.col) - 1, 0, GRID_COLS - 2);
      const newShape = normalizeShape({
        id: 'shape_' + Date.now(),
        color: state.currentColor,
        nodes: [
          { left: startLeft, right: startLeft + 2, y: 0, curveMode: state.currentCurveMode },
          { left: startLeft, right: startLeft + 2, y: Math.max(1, snapInt(gridPt.row, 1, state.gridRows)), curveMode: 'straight' }
        ]
      });
      state.shapes.push(newShape);
      selectSingleShape(newShape.id, 1);
      dragState.active = true;
      dragState.type = 'center';
      dragState.nodeIndex = 1;
      dragState.pendingSnapshot = snapBefore;
      renderAll();
    });

    paletteCanvas.addEventListener('pointermove', (evt) => {
      if (!dragState.active) return;
      const pos = getCanvasMousePos(paletteCanvas, evt);
      const gridPt = paletteXYToGrid(pos.x, pos.y);
      const shape = getActiveShape();
      if (!shape) return;

      if (dragState.type === 'moveShape') {
        const dCol = Math.round(gridPt.col) - dragState.startGridCol;
        for (let k = 0; k < shape.nodes.length; k++) {
          const w = dragState.initialNodes[k].right - dragState.initialNodes[k].left;
          const newL = Math.max(0, Math.min(GRID_COLS - w, dragState.initialNodes[k].left + dCol));
          shape.nodes[k].left = newL;
          shape.nodes[k].right = newL + w;
        }
      } else if (dragState.type === 'left') {
        // 左端の縦辺ドラッグ：幅を変更（横移動ではなく幅の伸縮）
        const node = shape.nodes[dragState.nodeIndex];
        const newLeft = Math.max(0, Math.min(node.right - 1, Math.round(gridPt.col)));
        node.left = newLeft;
      } else if (dragState.type === 'right') {
        // 右端の縦辺ドラッグ：幅を変更
        const node = shape.nodes[dragState.nodeIndex];
        const newRight = Math.max(node.left + 1, Math.min(GRID_COLS, Math.round(gridPt.col)));
        node.right = newRight;
      } else if (dragState.type === 'center') {
        const node = shape.nodes[dragState.nodeIndex];
        const w = node.right - node.left;
        node.left = snapInt(Math.round(gridPt.col) - Math.floor(w / 2), 0, GRID_COLS - w);
        node.right = node.left + w;
        node.y = snapFine1920(gridPt.row, 0, state.gridRows);
      }
      renderAll();
    });

    function finishPointerDrag() {
      if (!dragState.active) return;
      if (dragState.pendingSnapshot) {
        state.history.push(dragState.pendingSnapshot);
        state.redoStack = [];
        updateHistoryButtons();
      }
      dragState.active = false;
      dragState.type = null;
      renderAll();
    }

    paletteCanvas.addEventListener('pointerup', finishPointerDrag);
    paletteCanvas.addEventListener('pointercancel', finishPointerDrag);

    // カーブボタン（選択中のセグメントのみ変更）
    document.querySelectorAll('.curve-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.curve;
        state.currentCurveMode = mode;
        const sh = getActiveShape();
        if (sh && sh.nodes.length >= 2) {
          saveHistory();
          const segIdx = Math.min(state.activeNodeIndex, sh.nodes.length - 2);
          sh.nodes[segIdx].curveMode = mode; // アクティブなセグメントのみ変更！
          renderAll();
        }
        syncUIWithSelectedShape();
      });
    });

    document.getElementById('btnClearAll').addEventListener('click', () => {
      saveHistory();
      state.shapes = [];
      selectSingleShape(null);
      renderAll();
    });

    function getCanvasMousePos(canvas, evt) {
      const rect = canvas.getBoundingClientRect();
      return { x: (evt.clientX - rect.left) * (PALETTE_LOGICAL_W / rect.width), y: (evt.clientY - rect.top) * (PALETTE_LOGICAL_H / rect.height) };
    }

    window.onload = () => {
      setPaletteZoom(100);
      renderAll();
    };
  </script>
</body>
</html>
